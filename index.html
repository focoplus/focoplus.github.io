<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foco+</title>
<meta name="description" content="Foco+: inglés, SQL, lectura, ejercicio y finanzas en una sola app, cada uno con su progreso.">
<meta name="theme-color" content="#16213A">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="iconos/favicon.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Foco+">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#16213A; --muted:#566476; --line:#D3DDD9; --chip:#E1E9E6;
  --accent:#F2541B; --accent-ink:#FFFFFF; --teal:#0C8F80; --gold:#D99A00; --gold-soft:#FFF1CC;
  --good:#17894E; --good-soft:#D6F2E2; --bad:#C9372F; --bad-soft:#FBE1DE;
  --f-display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:16px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151F; --surface:#172130; --ink:#E8EFEC; --muted:#9AA8B6; --line:#2A3748; --chip:#212D3D;
  --accent:#FF7442; --accent-ink:#1A0C05; --teal:#2DBFAC; --gold:#F5BF2A; --gold-soft:#3A3014;
  --good:#3CC47A; --good-soft:#15352A; --bad:#F0685F; --bad-soft:#3A1E1F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151F; --surface:#172130; --ink:#E8EFEC; --muted:#9AA8B6; --line:#2A3748; --chip:#212D3D;
  --accent:#FF7442; --accent-ink:#1A0C05; --teal:#2DBFAC; --gold:#F5BF2A; --gold-soft:#3A3014;
  --good:#3CC47A; --good-soft:#15352A; --bad:#F0685F; --bad-soft:#3A1E1F; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;
  padding:env(safe-area-inset-top,0px) 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}

/* Barra superior */
.top{display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:24px;flex:1;min-width:0}
.brand img{width:36px;height:36px;border-radius:10px}
.who{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:15px;max-width:55%}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:50%;color:#fff;font-family:var(--f-display);font-weight:800;font-size:17px}
.av.lg{width:48px;height:48px;font-size:21px}

/* Saludo */
.hello{padding:14px 0 6px}
.hello h1{font-size:clamp(28px,7.5vw,38px);font-weight:800;line-height:1.05}
.hello h1 em{font-style:normal;color:var(--accent)}
.hello p{color:var(--muted);margin-top:6px}

/* Módulos */
.mods{display:grid;gap:12px;margin-top:16px}
.mod{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r);
  background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;text-decoration:none;color:inherit;transition:transform .1s}
.mod:active{transform:translateY(3px);border-bottom-width:2px}
.mod:hover{border-color:var(--ink)}
.mod .ic{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;background:var(--c)}
.mod .ic svg{width:38px;height:38px}
.mod h2{font-size:21px;font-weight:800}
.mod p{color:var(--muted);font-size:15px;line-height:1.3;margin-top:2px}
.mod .st{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:13px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--chip);color:var(--ink)}
.mod .go{color:var(--muted)}
.mod .go svg{width:22px;height:22px}

/* Tarjetas genéricas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.card.install{background:var(--gold-soft);border:2px dashed var(--gold);margin-top:16px}
.card h3{font-size:19px;font-weight:800}
.card p{color:var(--muted);font-size:15px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.section{margin-top:28px;display:grid;gap:10px}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:var(--r);
  font-weight:800;font-family:var(--f-display);font-size:18px;background:var(--accent);color:var(--accent-ink);
  border-bottom:5px solid color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.btn.full{width:100%}
.btn svg{width:20px;height:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 150px}
.link{color:var(--teal);font-weight:700;text-decoration:underline;padding:6px;justify-self:center}

/* Formularios */
form{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field span{font-weight:700;font-size:15px}
.field small{color:var(--muted);font-size:13px}
input[type=text],input[type=number]{width:100%;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 96px;gap:10px}
.err{color:var(--bad);font-weight:700;font-size:15px}

/* Perfiles */
.plist{display:grid;gap:10px}
.prow{display:flex;gap:8px;align-items:stretch}
.pbtn{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px}
.pbtn:hover{border-color:var(--ink)}
.pbtn.cur{border-color:var(--teal)}
.pn{min-width:0}
.pn b{font-family:var(--f-display);font-size:20px;display:block;overflow-wrap:anywhere}
.pn small{color:var(--muted);font-size:14px}
.pedit{padding:0 14px;border-radius:var(--r);background:var(--surface);color:var(--ink);font-weight:700;border:2px solid var(--line)}
.editcard{margin:2px 0 6px}
.pacts{display:grid;gap:6px;flex:0 0 auto}.pacts button{padding:6px 12px;font-size:14px}
.pdel{padding:0 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-weight:700;border:2px solid var(--bad)}
.aviso{background:var(--gold-soft);border:2px solid var(--gold);border-radius:var(--r);padding:14px 16px;display:grid;gap:10px;margin-top:12px}
.aviso h3{font-size:17px;font-weight:800}
.aviso p{font-size:14.5px;color:var(--ink);opacity:.85}
.bk-last{font-size:13.5px;color:var(--muted);text-align:center}
.bk-last b{color:var(--good)}
.bk-scrim{position:fixed;inset:0;background:rgba(16,22,32,.45);z-index:60}
.bk-sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:24px 24px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom,0px))}
.bk-sheet .in{max-width:540px;margin:0 auto;display:grid;gap:12px}
.bk-sheet h3{font-size:20px;font-weight:800}
.bk-lock{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px}
.btn.teal{background:#0C8F80;color:#fff;border-bottom-color:#06574E}
.confirm{background:var(--bad-soft);border:2px solid var(--bad);border-radius:var(--r);padding:14px;display:grid;gap:10px}

.foot{margin-top:28px;text-align:center;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,calc(100% + 60px));background:var(--ink);color:var(--bg);
  padding:12px 18px;border-radius:12px;font-weight:700;transition:transform .25s;z-index:20;max-width:calc(100% - 32px);text-align:center}
.toast:empty{visibility:hidden}
.toast.show{transform:translate(-50%,0)}
.hero-ic{width:88px;height:88px;border-radius:24px;margin:8px 0 4px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
  <p class="foot">Foco+ · tu progreso se guarda en este teléfono</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="application/json,.json" hidden>

<script>
/* =========================================================
   MÓDULOS: para agregar uno nuevo, se suma una entrada aquí
   y una carpeta con su index.html (que carga ../perfil.js)
   ========================================================= */
const MODULOS = [
  { id:'english', nombre:'Inglés', desc:'Aprende inglés jugando, de a poco y sin agobio.', href:'english/', color:'#F2541B',
    icono:'<svg viewBox="0 0 40 40"><path d="M7 7h26a4 4 0 0 1 4 4v14a4 4 0 0 1-4 4H16l-7 6v-6H7a4 4 0 0 1-4-4V11a4 4 0 0 1 4-4z" fill="#fff"/><text x="20" y="23.5" text-anchor="middle" font-family="Bricolage Grotesque,Arial,sans-serif" font-weight="800" font-size="13" fill="#F2541B">Aa</text></svg>',
    estado: d => {
      const s = leer(d, 'focoEnglish:main'); if (!s || !s.xp) return [];
      let l = 1, need = 100, r = s.xp; while (r >= need) { r -= need; l++; need = 100 + 40 * (l - 1); }
      return ['Nivel ' + l, (s.streak || 0) + ' días seguidos'];
    } },
  { id:'sql', nombre:'SQL', desc:'Aprende a consultar datos desde cero.', href:'sql/', color:'#1F4E79',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3"><ellipse cx="20" cy="10" rx="12" ry="4.5" fill="#fff"/><path d="M8 10v20c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5V10"/><path d="M8 20c0 2.5 5.4 4.5 12 4.5s12-2 12-4.5"/></svg>',
    estado: d => {
      const s = leer(d, 'foco-sql'); if (!s) return [];
      const n = Object.keys(s.done || {}).length; if (!n && !s.xp) return [];
      return [n + (n === 1 ? ' lección' : ' lecciones'), (s.xp || 0) + ' XP'];
    } },
  { id:'lectura', nombre:'Lectura', desc:'Registra tu tiempo de lectura y tus libros.', href:'lectura/', color:'#C9475E',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M20 11c-3-3-8-3.5-14-3v23c6-.5 11 0 14 3 3-3 8-3.5 14-3V8c-6-.5-11 0-14 3z" fill="#fff" fill-opacity=".18"/><path d="M20 11v23"/></svg>',
    estado: d => {
      const all = leer(d, 'foco-lectura-v1'); if (!all) return [];
      const mes = new Date().toLocaleDateString('en-CA').slice(0, 7); let seg = 0, libros = 0;
      for (const k in all) { const x = all[k]; if (!x) continue;
        if (x.kind === 'session' && String(x.date || '').startsWith(mes)) seg += Number(x.seconds ?? (Number(x.minutes) || 0) * 60) || 0;
        if (x.kind === 'book') libros++; }
      if (!seg && !libros) return [];
      return [Math.round(seg / 60) + ' min este mes', libros + (libros === 1 ? ' libro' : ' libros')];
    } },
  { id:'ejercicio', nombre:'Ejercicio', desc:'Registra tu actividad física y tu meta semanal.', href:'ejercicio/', color:'#1F7A4A',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 13v14M27 13v14M8 16v8M32 16v8M13 20h14"/></svg>',
    estado: d => {
      const all = leer(d, 'foco-ejercicio-v1'); if (!all) return [];
      const hoy = new Date(); const lun = new Date(hoy); lun.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7));
      const desde = lun.toLocaleDateString('en-CA'); let min = 0, dias = new Set();
      for (const k in all) { const x = all[k]; if (x && x.kind === 'ses' && String(x.date || '') >= desde) { min += Number(x.min) || 0; dias.add(x.date); } }
      if (!min) return [];
      return [min + ' min esta semana', dias.size + (dias.size === 1 ? ' día activo' : ' días activos')];
    } },
  { id:'super', nombre:'Súper', desc:'Calculadora para ir sumando en el supermercado.', href:'super/', color:'#6D44C9',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h3.5l3.5 17h16l3.5-12H11.2" fill="#fff" fill-opacity=".18"/><circle cx="15" cy="31" r="2.2"/><circle cx="27" cy="31" r="2.2"/></svg>',
    estado: d => {
      const s = leer(d, 'foco-super-v1'); if (!s) return [];
      if (s.actual && s.actual.items && s.actual.items.length) return ['🛒 Compra en curso'];
      const mes = new Date().toLocaleDateString('en-CA').slice(0, 7);
      const n = (s.compras || []).filter(c => String(c.date || '').startsWith(mes)).length;
      const l = (s.lista || []).length;
      return [n ? n + (n === 1 ? ' compra este mes' : ' compras este mes') : '', l ? l + (l === 1 ? ' cosa en la lista' : ' cosas en la lista') : ''].filter(Boolean);
    } },
  { id:'finanzas', nombre:'Finanzas', desc:'Ordena tus ingresos, gastos y ahorros del mes.', href:'finanzas/', color:'#B7791F',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><rect x="5" y="11" width="30" height="19" rx="3.5" fill="#fff" fill-opacity=".18"/><circle cx="20" cy="20.5" r="4.5"/><path d="M10 16v0M30 25v0" stroke-linecap="round" stroke-width="3.6"/></svg>',
    // Privado: en el menú solo se indica si está protegido, nunca montos ni movimientos
    estado: d => ls.get('fp.pin.' + d) ? ['🔒 Protegido con PIN'] : ['Te pedirá crear un PIN'] },
  { id:'foco', nombre:'Foco', desc:'Temporizador para concentrarte, de a poco.', href:'foco/', color:'#0C8F80',
    icono:'<svg viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="20" cy="22" r="12.5"/><path d="M20 22V9.5A12.5 12.5 0 0 1 32.5 22Z" fill="#fff" stroke="none"/><path d="M16 4.5h8"/></svg>',
    estado: d => {
      const s = leer(d, 'foco-timer-v1'); if (!s) return [];
      if (s.run) return [s.run.phase === 'descanso' ? '☕ En descanso' : '⏱ Enfocado ahora'];
      const hoy = new Date().toLocaleDateString('en-CA'); const m = (s.ses || []).filter(x => x.date === hoy).reduce((a, x) => a + (Number(x.min) || 0), 0);
      return m ? [(m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '')) + ' de foco hoy'] : [];
    } },
];
// Orden en el menú
const ORDEN = ['english', 'ejercicio', 'lectura', 'super', 'finanzas', 'foco', 'sql'];
MODULOS.sort((a, b) => ORDEN.indexOf(a.id) - ORDEN.indexOf(b.id));

/* ---------- Almacenamiento ---------- */
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e) { return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e) {} },
  keys(){ try { return Object.keys(localStorage); } catch(e) { return []; } }
};
const pre = id => 'p:' + id + ':';
function leer(id, k){ try { return JSON.parse(ls.get(pre(id) + k) || 'null'); } catch(e) { return null; } }
let perfiles = []; try { perfiles = JSON.parse(ls.get('fp.profiles') || '[]'); } catch(e) {}
let actual = ls.get('fp.cur') || '';
const guardar = () => { ls.set('fp.profiles', JSON.stringify(perfiles)); ls.set('fp.cur', actual); };
const yo = () => perfiles.find(p => p.id === actual) || null;
if (!yo()) actual = perfiles.length === 1 ? perfiles[0].id : '';

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORES = ['#F2541B','#0C8F80','#17894E','#7A4FD1','#1F4E79','#C9475E','#B7791F'];
const inicial = n => (String(n).trim()[0] || '?').toUpperCase();
const avatar = (p, lg) => `<span class="av${lg ? ' lg' : ''}" style="background:${COLORES[(p.c || 0) % COLORES.length]}">${esc(inicial(p.name))}</span>`;
const nuevoId = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2600); }
const flecha = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>';
const iconoDescarga = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';

function crearPerfil(name, age){
  const p = { id: nuevoId(), name: name.trim(), age, c: perfiles.length % COLORES.length };
  perfiles.push(p); guardar(); return p;
}
function validar(form){
  const name = form.querySelector('[name=name]').value.trim();
  const age = parseInt(form.querySelector('[name=age]').value, 10);
  const err = form.querySelector('.err');
  const fail = m => { err.textContent = m; err.hidden = false; return null; };
  if (!name) return fail('Escribe un nombre.');
  if (name.length > 20) return fail('Usa un nombre más corto (máximo 20 letras).');
  if (!(age >= 3 && age <= 110)) return fail('Escribe una edad válida.');
  return { name, age };
}
const formPerfil = (boton, fid = 'fp', v = {}) => `
  <form id="${fid}" novalidate>
    <div class="two">
      <label class="field"><span>Nombre</span><input type="text" name="name" maxlength="20" autocomplete="given-name" placeholder="Ej: Martina" value="${esc(v.name || '')}"></label>
      <label class="field"><span>Edad</span><input type="number" name="age" inputmode="numeric" min="3" max="110" placeholder="00" value="${v.age || ''}"></label>
    </div>
    <small style="color:var(--muted);font-size:13px">La edad ajusta algunos contenidos (por ejemplo, en Inglés).</small>
    <p class="err" hidden></p>
    <button class="btn full" type="submit">${boton}</button>
  </form>`;

/* ---------- Instalación ---------- */
let aviso = null;
const instalada = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); aviso = e; if (vista === 'menu') render(); });
window.addEventListener('appinstalled', () => { aviso = null; toast('¡Foco+ quedó instalada en tu teléfono!'); if (vista === 'menu') render(); });
function tarjetaInstalar(){
  if (instalada()) return '';
  if (aviso) return `<div class="card install"><h3>Instala Foco+ en tu teléfono</h3>
    <p>Queda con su ícono junto a tus apps y funciona sin internet.</p>
    <button class="btn full" id="instalar">${iconoDescarga} Instalar</button></div>`;
  if (esIOS) return `<div class="card install"><h3>Instala Foco+ en tu iPhone</h3>
    <p>En Safari toca <b>Compartir</b> (cuadrado con flecha) y luego <b>“Agregar a pantalla de inicio”</b>.</p></div>`;
  return '';
}

/* ---------- Vistas ---------- */
let vista = 'menu', pendiente = null, confirmar = null, editar = null;

function renderTop(){
  const p = yo();
  $('#top').innerHTML = `<div class="brand"><img src="iconos/foco-luz-192.png" alt="">Foco+</div>` +
    (p && vista === 'menu' ? `<button class="who" id="cambiar" aria-label="Cambiar de perfil (ahora: ${esc(p.name)})">${avatar(p)}<span>${esc(p.name)}</span></button>` : '');
  const b = $('#cambiar'); if (b) b.onclick = () => { vista = 'quien'; render(); };
}

function render(){
  if (pendiente) vista = 'importar';
  else if (!perfiles.length) vista = 'bienvenida';
  else if (!yo() && vista === 'menu') vista = 'quien';
  renderTop();
  ({ bienvenida, quien, menu, importar })[vista]();
  window.scrollTo(0, 0);
}

function bienvenida(){
  $('#app').innerHTML = `<section class="hello">
    <img class="hero-ic" src="iconos/foco-luz-192.png" alt="">
    <h1>Bienvenido a <em>Foco+</em></h1>
    <p>Inglés, ejercicio, lectura, súper, finanzas, foco y SQL en un solo lugar. Cada persona tiene su propio perfil y su propio progreso.</p>
  </section>
  <div class="card" style="margin-top:12px"><h3>¿Cómo te llamas?</h3>${formPerfil('Empezar')}</div>`;
  $('#fp').onsubmit = e => { e.preventDefault(); const v = validar(e.target); if (!v) return;
    actual = crearPerfil(v.name, v.age).id; guardar(); vista = 'menu'; render(); toast('¡Hola, ' + v.name + '!'); };
}

function quien(){
  const cf = confirmar && perfiles.find(p => p.id === confirmar);
  $('#app').innerHTML = `<section class="hello"><h1>¿Quién va a <em>usar</em> Foco+?</h1>
    <p>Cada perfil guarda su propio progreso en este teléfono.</p></section>
  ${cf ? `<div class="confirm"><b>¿Borrar el perfil de ${esc(cf.name)}?</b>
      <p style="font-size:15px">Se borra todo su progreso en todos los módulos. No se puede deshacer.</p>
      <div class="row"><button class="btn" id="si" style="background:var(--bad);border-bottom-color:color-mix(in srgb,var(--bad) 60%,#000)">Sí, borrar</button>
      <button class="btn ghost" id="no">Cancelar</button></div></div>` : ''}
  <div class="plist" style="margin-top:14px">${perfiles.map(p => `
    <div class="prow"><button class="pbtn${p.id === actual ? ' cur' : ''}" data-id="${p.id}">${avatar(p, true)}
      <span class="pn"><b>${esc(p.name)}</b><small>${p.age} años${p.id === actual ? ' · perfil actual' : ''}</small></span></button>
      <span class="pacts"><button class="pedit" data-edit="${p.id}" aria-label="Editar perfil de ${esc(p.name)}">Editar</button>
      <button class="pdel" data-del="${p.id}" aria-label="Borrar perfil de ${esc(p.name)}">Borrar</button></span></div>
    ${editar === p.id ? `<div class="card editcard"><h3>Corregir nombre o edad</h3>${formPerfil('Guardar cambios', 'fe', p)}
      <button class="link" id="noedit" style="display:block;margin:10px auto 0">Cancelar</button>
      <small style="display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:6px">Su progreso no cambia.</small></div>` : ''}`).join('')}
  </div>
  <div class="card" style="margin-top:16px"><h3>Agregar persona</h3>${formPerfil('Agregar')}</div>
  ${yo() ? '<button class="link" id="volver" style="display:block;margin:12px auto 0">Volver al menú</button>' : ''}`;
  document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => { actual = b.dataset.id; confirmar = null; guardar(); vista = 'menu'; render(); toast('Hola, ' + yo().name); });
  document.querySelectorAll('.pdel').forEach(b => b.onclick = () => { confirmar = b.dataset.del; editar = null; render(); });
  document.querySelectorAll('.pedit').forEach(b => b.onclick = () => { editar = editar === b.dataset.edit ? null : b.dataset.edit; confirmar = null; render();
    const i = document.querySelector('#fe [name=name]'); if (i) { i.focus(); i.select(); } });
  const fe = $('#fe');
  if (fe) {
    fe.onsubmit = e => { e.preventDefault(); const v = validar(e.target); if (!v) return;
      if (perfiles.some(p => p.id !== editar && p.name.toLowerCase() === v.name.toLowerCase())) { const er = e.target.querySelector('.err'); er.textContent = 'Ya existe otro perfil con ese nombre.'; er.hidden = false; return; }
      const p = perfiles.find(x => x.id === editar); p.name = v.name; p.age = v.age; editar = null; guardar(); render(); toast('Listo, ahora es ' + v.name); };
    $('#noedit').onclick = () => { editar = null; render(); };
  }
  if (cf) {
    $('#si').onclick = () => { ls.keys().filter(k => k.startsWith(pre(cf.id))).forEach(ls.del); ls.del('fp.pin.' + cf.id);
      perfiles = perfiles.filter(p => p.id !== cf.id); if (actual === cf.id) actual = ''; confirmar = null; guardar(); vista = 'quien'; render(); toast('Perfil borrado'); };
    $('#no').onclick = () => { confirmar = null; render(); };
  }
  $('#fp').onsubmit = e => { e.preventDefault(); const v = validar(e.target); if (!v) return;
    if (perfiles.some(p => p.name.toLowerCase() === v.name.toLowerCase())) { const er = e.target.querySelector('.err'); er.textContent = 'Ya existe un perfil con ese nombre.'; er.hidden = false; return; }
    actual = crearPerfil(v.name, v.age).id; guardar(); vista = 'menu'; render(); toast('¡Hola, ' + v.name + '!'); };
  const vb = $('#volver'); if (vb) vb.onclick = () => { confirmar = null; editar = null; vista = 'menu'; render(); };
}

function menu(){
  const p = yo();
  $('#app').innerHTML = `<section class="hello"><h1>Hola, <em>${esc(p.name)}</em></h1><p>¿Qué quieres hacer hoy?</p></section>
  <nav class="mods" aria-label="Módulos">${MODULOS.map(m => {
    let st = []; try { st = m.estado(p.id) || []; } catch(e) {}
    return `<a class="mod" href="${m.href}" style="--c:${m.color}">
      <span class="ic" aria-hidden="true">${m.icono}</span>
      <span><h2>${m.nombre}</h2><p>${m.desc}</p>${st.length ? `<span class="st">${st.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</span>` : ''}</span>
      <span class="go" aria-hidden="true">${flecha}</span></a>`; }).join('')}
  </nav>
  ${tarjetaInstalar()}
  <section class="section"><div class="label">Respaldo</div>
    <div class="card"><p>Guarda una copia del progreso de todos los perfiles, por si cambias de teléfono o se borran los datos del navegador.</p>
      <div class="row"><button class="btn ghost" id="bajar">${iconoDescarga} Guardar copia</button><button class="btn ghost" id="subir">Restaurar</button></div>
      <div class="bk-last">${ultimoRespaldo()}</div></div>
  </section>`;
  if (respaldoPendiente()) {
    const nunca = !ls.get('fp.backup.last');
    $('.hello').insertAdjacentHTML('afterend', `<div class="aviso" role="status"><h3>💾 Guarda una copia de tu progreso</h3>
      <p>${nunca ? 'Todavía no tienes una copia.' : 'Hace un mes que no respaldas.'} Si cambias o pierdes el teléfono, así no pierdes nada. Toma 10 segundos.</p>
      <div class="row"><button class="btn" id="bk-si" style="white-space:nowrap;padding:0 12px">Guardar copia</button><button class="btn ghost" id="bk-no" style="white-space:nowrap;padding:0 12px">Ahora no</button></div></div>`);
    $('#bk-si').onclick = abrirRespaldo;
    $('#bk-no').onclick = () => { ls.set('fp.backup.snooze', String(Date.now() + 7 * DIA)); render(); toast('Te lo recuerdo en una semana'); };
  }
  const ib = $('#instalar'); if (ib) ib.onclick = async () => { const a = aviso; aviso = null; a.prompt(); try { await a.userChoice; } catch(e) {} render(); };
  $('#bajar').onclick = abrirRespaldo;
  $('#subir').onclick = () => $('#file').click();
}

/* ---------- Respaldo (archivo .json) ----------
   Aviso suave cada 30 días (o a los 7 días de uso si nunca se respaldó), solo si hay progreso que perder. */
const DIA = 86400000;
function hayProgreso(){
  return ls.keys().some(k => k.startsWith('p:') && !/(-view|focoEnglishProfiles)$/.test(k) && (ls.get(k) || '').length > 40);
}
function respaldoPendiente(){
  const now = Date.now();
  if (!ls.get('fp.backup.first')) ls.set('fp.backup.first', String(now));
  if (!hayProgreso()) return false;
  if (now < Number(ls.get('fp.backup.snooze') || 0)) return false;
  const last = Number(ls.get('fp.backup.last') || 0), first = Number(ls.get('fp.backup.first'));
  return last ? now - last > 30 * DIA : now - first > 7 * DIA;
}
function ultimoRespaldo(){
  const last = Number(ls.get('fp.backup.last') || 0); if (!last) return 'Todavía no guardas ninguna copia.';
  const d = Math.floor((new Date().setHours(0,0,0,0) - new Date(last).setHours(0,0,0,0)) / DIA);
  return 'Último respaldo: <b>' + (d <= 0 ? 'hoy' : d === 1 ? 'ayer' : 'hace ' + d + ' días') + '</b>' + (d <= 30 ? ' ✓' : '');
}
function archivoRespaldo(){
  const data = {}; ls.keys().filter(k => k.startsWith('fp.') || k.startsWith('p:')).forEach(k => data[k] = ls.get(k));
  const nombre = 'foco-plus-respaldo-' + new Date().toLocaleDateString('en-CA') + '.json';
  const txt = JSON.stringify({ app:'foco-plus', v:1, fecha:new Date().toISOString(), data });
  return { nombre, txt };
}
function respaldoListo(){
  ls.set('fp.backup.last', String(Date.now())); ls.del('fp.backup.snooze');
  cerrarRespaldo(); render(); toast('Copia guardada. Nos vemos en un mes 👍');
}
function puedeCompartir(){
  try { const f = new File(['{}'], 'x.json', { type:'application/json' }); return !!(navigator.canShare && navigator.canShare({ files:[f] })); } catch(e) { return false; }
}
function abrirRespaldo(){
  const share = puedeCompartir();
  const w = document.createElement('div'); w.id = 'bk';
  w.innerHTML = `<div class="bk-scrim" data-bk="x"></div><div class="bk-sheet" role="dialog" aria-modal="true" aria-label="Guardar copia"><div class="in">
    <h3>Guardar copia de tu progreso</h3>
    <p style="color:var(--muted);font-size:15px">Incluye todos los perfiles y módulos de este teléfono.</p>
    ${share ? '<button class="btn teal full" data-bk="share">Mandar a Drive, correo o WhatsApp</button>' : ''}
    <button class="btn ${share ? 'ghost' : ''} full" data-bk="down">${share ? 'Solo descargar en el teléfono' : iconoDescarga + ' Descargar copia'}</button>
    ${share ? '' : '<p style="color:var(--muted);font-size:14px">Después súbela a tu Drive o mándatela por correo: así queda fuera del teléfono.</p>'}
    <div class="bk-lock">🔒 La copia <b>no lleva tu PIN</b>: quien la abra podría ver tus finanzas. Mejor a tu Drive o a tu correo, no a un chat con otras personas.</div>
    <button class="link" data-bk="x" style="justify-self:center">Ahora no</button></div></div>`;
  document.body.appendChild(w);
  w.onclick = async e => {
    const b = e.target.closest('[data-bk]'); if (!b) return;
    const act = b.dataset.bk;
    if (act === 'x') return cerrarRespaldo();
    const { nombre, txt } = archivoRespaldo();
    if (act === 'share') {
      try { await navigator.share({ files:[new File([txt], nombre, { type:'application/json' })], title:'Respaldo de Foco+' }); respaldoListo(); }
      catch(err) { if (err && err.name === 'AbortError') return; toast('No se pudo compartir. Prueba con “Solo descargar”.'); }
    }
    if (act === 'down') {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type:'application/json' })); a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      respaldoListo();
    }
  };
}
function cerrarRespaldo(){ const w = $('#bk'); if (w) w.remove(); }
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'foco-plus' || !j.data) throw 0;
    ls.keys().filter(k => k.startsWith('fp.') || k.startsWith('p:')).forEach(ls.del);
    for (const k in j.data) if (k.startsWith('fp.') || k.startsWith('p:')) ls.set(k, j.data[k]);
    try { perfiles = JSON.parse(ls.get('fp.profiles') || '[]'); } catch(_) { perfiles = []; }
    actual = ls.get('fp.cur') || ''; if (!yo()) actual = '';
    vista = 'menu'; render(); toast('Respaldo restaurado');
  } catch(err) { toast('Ese archivo no es un respaldo de Foco+'); }
};

/* ---------- Recibir progreso desde las versiones anteriores ----------
   Llega en el link: index.html#importar=<datos>  (no pasa por ningún servidor) */
function decodificar(txt){
  const b64 = txt.replace(/-/g, '+').replace(/_/g, '/');
  const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
  return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
}
(function leerLink(){
  const m = location.hash.match(/importar=([^&]+)/); if (!m) return;
  history.replaceState(null, '', location.pathname + location.search);
  try {
    const d = decodificar(decodeURIComponent(m[1]));
    if (d && d.v === 1 && ['english', 'sql', 'lectura', 'ejercicio', 'finanzas', 'plata'].includes(d.app)) pendiente = d;
  } catch(e) { setTimeout(() => toast('No se pudo leer el progreso del link'), 300); }
})();
const nombreMod = id => (MODULOS.find(m => m.id === (id === 'plata' ? 'finanzas' : id)) || {}).nombre || id;
const CLAVE = { sql:'foco-sql', lectura:'foco-lectura-v1', ejercicio:'foco-ejercicio-v1', finanzas:'foco-plata-v1', plata:'foco-plata-v1' };

function importar(){
  const d = pendiente;
  if (d.app === 'english') {
    const lista = (d.profiles || []).filter(x => x && x.name);
    $('#app').innerHTML = `<section class="hello"><h1>¡Tu progreso de <em>Inglés</em> llegó!</h1>
      <p>Revisa los jugadores que vienen de la versión anterior. Cada uno queda como un perfil de Foco+.</p></section>
      <form id="imp" novalidate style="margin-top:12px">
      ${lista.map((x, i) => { const ex = perfiles.find(p => p.name.toLowerCase() === x.name.trim().toLowerCase());
        return `<div class="card"><div class="two"><label class="field"><span>Nombre</span><input type="text" name="n${i}" maxlength="20" value="${esc(x.name)}"></label>
          <label class="field"><span>Edad</span><input type="number" name="a${i}" inputmode="numeric" min="3" max="110" value="${x.age ?? ''}" placeholder="00"></label></div>
          ${ex ? `<small style="color:var(--muted);font-size:13px">Ya existe “${esc(ex.name)}” aquí: se le reemplaza el progreso de Inglés.</small>` : ''}</div>`; }).join('')}
      <p class="err" hidden></p>
      <button class="btn full" type="submit">Traer mi progreso</button></form>
      <button class="link" id="cancel" style="display:block;margin:12px auto 0">Ahora no</button>`;
    $('#imp').onsubmit = e => { e.preventDefault(); const f = e.target, err = f.querySelector('.err');
      const filas = lista.map((x, i) => ({ x, name: f['n' + i].value.trim(), age: parseInt(f['a' + i].value, 10) }));
      if (filas.some(r => !r.name || !(r.age >= 3 && r.age <= 110))) { err.textContent = 'Completa el nombre y la edad de cada jugador.'; err.hidden = false; return; }
      let primero = null;
      for (const r of filas) {
        let p = perfiles.find(q => q.name.toLowerCase() === r.name.toLowerCase());
        if (p) { p.age = r.age; } else p = crearPerfil(r.name, r.age);
        if (r.x.data) ls.set(pre(p.id) + 'focoEnglish:main', typeof r.x.data === 'string' ? r.x.data : JSON.stringify(r.x.data));
        primero = primero || p;
      }
      actual = primero ? primero.id : actual; guardar(); pendiente = null; vista = 'menu'; render(); toast('¡Progreso de Inglés recuperado!'); };
  } else {
    $('#app').innerHTML = `<section class="hello"><h1>¡Tu progreso de <em>${nombreMod(d.app)}</em> llegó!</h1>
      <p>¿A qué perfil se lo asignamos?</p></section>
      ${perfiles.length ? `<div class="plist" style="margin-top:12px">${perfiles.map(p => `<button class="pbtn" data-id="${p.id}">${avatar(p, true)}
        <span class="pn"><b>${esc(p.name)}</b><small>${leer(p.id, CLAVE[d.app]) ? 'Ya tiene progreso aquí: se reemplaza' : p.age + ' años'}</small></span></button>`).join('')}</div>` : ''}
      <div class="card" style="margin-top:16px"><h3>${perfiles.length ? 'O crea un perfil nuevo' : 'Crea tu perfil'}</h3>${formPerfil('Crear y traer progreso')}</div>
      <button class="link" id="cancel" style="display:block;margin:12px auto 0">Ahora no</button>`;
    const asignar = p => { ls.set(pre(p.id) + CLAVE[d.app], typeof d.data === 'string' ? d.data : JSON.stringify(d.data || {}));
      actual = p.id; guardar(); pendiente = null; vista = 'menu'; render(); toast('¡Progreso de ' + nombreMod(d.app) + ' recuperado!'); };
    document.querySelectorAll('.pbtn').forEach(b => b.onclick = () => asignar(perfiles.find(p => p.id === b.dataset.id)));
    $('#fp').onsubmit = e => { e.preventDefault(); const v = validar(e.target); if (!v) return; asignar(crearPerfil(v.name, v.age)); };
  }
  $('#cancel').onclick = () => { pendiente = null; vista = 'menu'; render(); };
}

/* ---------- Arranque ---------- */
render();
window.addEventListener('pageshow', e => { if (e.persisted && vista === 'menu') render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
