<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una sola columna enfocada (máx 680px) — mapa de lecciones como sendero, una tarea a la vez, barra de acción fija abajo */
:root {
  --bg: #eef2f6;
  --surface: #ffffff;
  --ink: #17212e;
  --muted: #5b6878;
  --line: #d4dce6;
  --accent: #f2a516;     /* marigold: la "luz de foco" */
  --accent-ink: #3a2700;
  --brand: #1f4e79;      /* azul pizarra */
  --ok: #15805a;
  --ok-soft: #dff3ea;
  --bad: #b33a3a;
  --bad-soft: #f9e3e3;
  --code-bg: #f4f7fb;
  --kw: #1f4e79;
  --str: #9b5a00;
  --warn-soft: #fdf1d8;
  --warn-ink: #8a5a00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111821; --surface: #19232f; --ink: #e8eef5; --muted: #9aa8b8; --line: #2c3a4a;
  --accent: #f5b53a; --accent-ink: #2a1c00; --brand: #8cc0ef; --ok: #4ccf98; --ok-soft: #12352a;
  --bad: #f08a8a; --bad-soft: #3b1d1f; --code-bg: #121b25; --kw: #8cc0ef; --str: #f5c46a; --warn-soft: #2e2512; --warn-ink: #f5c46a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111821; --surface: #19232f; --ink: #e8eef5; --muted: #9aa8b8; --line: #2c3a4a;
  --accent: #f5b53a; --accent-ink: #2a1c00; --brand: #8cc0ef; --ok: #4ccf98; --ok-soft: #12352a;
  --bad: #f08a8a; --bad-soft: #3b1d1f; --code-bg: #121b25; --kw: #8cc0ef; --str: #f5c46a; --warn-soft: #2e2512; --warn-ink: #f5c46a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
code, .mono { font-family: var(--f-mono); font-size: .9em; }
p { margin: 0; }

/* Top bar */
.top { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding-block: 4px 16px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand h1 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.brand h1 span { background: var(--accent); color: var(--accent-ink); padding: 0 6px; border-radius: 6px; margin-left: 2px; }
.stats { display: flex; gap: 8px; font-variant-numeric: tabular-nums; }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-weight: 700; font-size: 15px; white-space: nowrap; }
.pill small { font-weight: 400; color: var(--muted); }
.iconbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 4px 10px; font-size: 14px; }

/* Map */
.hello { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 12px; }
.hello h2 { font-size: 24px; }
.hello p { color: var(--muted); max-width: 60ch; }
.next-btn { justify-self: start; }
.path { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 0; position: relative; }
.path li { position: relative; padding-left: 56px; padding-block: 6px; }
.path li::before { content: ""; position: absolute; left: 21px; top: 0; bottom: 0; width: 3px; background: var(--line); }
.path li:first-child::before { top: 50%; }
.path li:last-child::before { bottom: 50%; }
.node { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 14px; background: var(--surface); border: 3px solid var(--line); color: var(--muted); z-index: 1; font-variant-numeric: tabular-nums; }
.path li.done .node { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.path li.current .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }
.lesson-btn { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; color: var(--ink); display: grid; gap: 2px; }
.lesson-btn:hover { border-color: var(--brand); }
.path li.current .lesson-btn { border: 2px solid var(--accent); }
.lesson-btn b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }
.lesson-btn span { color: var(--muted); font-size: 15px; }
.lesson-btn .kwtag { font-family: var(--f-mono); font-size: 13px; color: var(--brand); }
.boss .node { border-radius: 8px; }
.path li.weak .node { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-family: var(--f-display); font-weight: 800; }
.path li.weak .lesson-btn { border-color: var(--accent); border-style: dashed; }
.weak-tag { color: var(--warn-ink) !important; font-weight: 700; font-size: 14px !important; }
.reinforce { margin-top: 16px; background: var(--warn-soft); border: 2px solid var(--accent); border-radius: 18px; padding: 16px 18px; display: grid; gap: 12px; }
.reinforce p { font-size: 15px; max-width: 60ch; }
.reinforce-list { display: grid; gap: 8px; }
.rf-btn { text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: grid; gap: 2px; }
.rf-btn:hover { border-color: var(--accent); }
.rf-btn b { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.rf-btn span { color: var(--muted); font-size: 14px; }
.missed { text-align: left; background: var(--warn-soft); border-radius: 12px; padding: 12px 16px; width: 100%; max-width: 520px; }
.missed ul { margin: 6px 0 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.done-card.is-weak .stamp { background: var(--surface); color: var(--accent); border: 6px solid var(--accent); }


/* Lesson screen */
.lesson-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.back { background: none; border: none; color: var(--muted); font-size: 15px; padding: 6px 0; }
.steps { flex: 1; display: flex; gap: 6px; overflow-x: auto; padding-block: 4px; scrollbar-width: none; }
.stp { flex: 0 0 auto; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--muted); font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.stp.learn { font-family: var(--f-body); font-size: 13px; }
.stp.ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.stp.cur { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.stp:disabled { opacity: .4; cursor: default; }
.stp:not(:disabled):not(.cur):hover { border-color: var(--brand); }
.prog-tag { color: var(--brand) !important; font-weight: 700; font-size: 14px !important; }
.bar { flex: 1; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .35s ease; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 14px; }
.eyebrow { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.card h2 { font-size: 26px; }
.card .q { font-size: 19px; font-weight: 700; }
.explain { display: grid; gap: 10px; max-width: 62ch; }
.explain b { color: var(--brand); }
.sql { background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-family: var(--f-mono); font-size: 15px; white-space: pre-wrap; word-break: break-word; }
.sql .k { color: var(--kw); font-weight: 600; }
.sql .s { color: var(--str); }
.tip { border-left: 4px solid var(--accent); padding: 4px 0 4px 12px; color: var(--muted); font-size: 15px; }

/* Editor */
.editor { width: 100%; min-height: 96px; resize: vertical; background: var(--code-bg); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 12px; font-family: var(--f-mono); font-size: 16px; line-height: 1.5; }
.editor:focus { border-color: var(--brand); outline: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-family: var(--f-mono); font-size: 14px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 8px; padding: 5px 10px; }
.chip.kw { color: var(--kw); font-weight: 600; }
.chip.tool { color: var(--muted); font-family: var(--f-body); }
.chip:active { transform: translateY(2px); border-bottom-width: 1px; }
.chips-label { font-size: 13px; color: var(--muted); }

/* Choose */
.opts { display: grid; gap: 8px; }
.opt { text-align: left; background: var(--surface); color: var(--ink); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 17px; }
.opt:hover:not(:disabled) { border-color: var(--brand); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt code { font-size: 15px; }

/* Results */
.result { display: grid; gap: 6px; }
.result-meta { font-size: 13px; color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; max-height: 320px; overflow-y: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); background: var(--code-bg); position: sticky; top: 0; font-weight: 600; }
td.num { text-align: right; font-family: var(--f-mono); font-size: 13.5px; }
tr:last-child td { border-bottom: none; }
.tlabel { display: inline-flex; align-items: center; gap: 8px; justify-self: start; background: var(--code-bg); border: 1px solid var(--line); border-bottom: none; border-radius: 10px 10px 0 0; padding: 5px 12px; font-size: 13px; color: var(--muted); margin-bottom: -6px; }
.tlabel b { font-family: var(--f-mono); color: var(--brand); font-size: 14px; }
.tlabel i { font-style: normal; color: var(--muted); }
.tablewrap.labeled { border-top-left-radius: 0; }
.uses { font-size: 15px; color: var(--muted); margin-top: -6px; }
.uses b { font-family: var(--f-mono); color: var(--brand); font-weight: 600; }
.err { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 15px; }

/* Feedback */
.feedback { border-radius: 14px; padding: 14px 16px; display: grid; gap: 6px; }
.feedback.ok { background: var(--ok-soft); color: var(--ink); border: 2px solid var(--ok); }
.feedback.ok strong { color: var(--ok); }
.feedback.no { background: var(--bad-soft); border: 2px solid var(--bad); }
.feedback.no strong { color: var(--bad); }
.linkbtn { background: none; border: none; color: var(--brand); text-decoration: underline; padding: 0; font-size: 15px; justify-self: start; }

/* Action bar */
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.actionbar .in { max-width: 680px; margin: 0 auto; display: flex; gap: 10px; }
.btn { border-radius: 14px; padding: 13px 20px; font-weight: 700; font-size: 17px; border: 2px solid transparent; }
.btn.primary { background: var(--accent); color: var(--accent-ink); flex: 1; box-shadow: 0 3px 0 color-mix(in srgb, var(--accent) 60%, #000); }
.btn.primary:active { transform: translateY(2px); box-shadow: none; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; }

/* Drawer: tablas */
.drawer { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); z-index: 10; display: grid; align-items: end; }
.sheet { background: var(--bg); border-radius: 20px 20px 0 0; max-height: 85%; overflow-y: auto; padding: 18px 16px calc(24px + env(safe-area-inset-bottom, 0px)); max-width: 760px; width: 100%; margin: 0 auto; display: grid; gap: 16px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h3 { font-size: 20px; }
.tname { font-family: var(--f-mono); font-weight: 600; color: var(--brand); }
.tdesc { color: var(--muted); font-size: 14px; }

/* Done */
.done-card { text-align: center; justify-items: center; padding-block: 32px; }
.stamp { width: 110px; height: 110px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 34px; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(.3) rotate(-20deg); } to { transform: scale(1) rotate(0); } }
.loading { text-align: center; color: var(--muted); padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { .stamp { animation: none; } .bar i { transition: none; } }
@media (max-width: 420px) { .brand h1 { font-size: 22px; } .pill { padding: 3px 9px; font-size: 14px; } .card { padding: 16px; } }
</style>

<script>
/* ================= DATOS: El Almacén ================= */
const SEED = `
CREATE TABLE productos (id INTEGER, nombre TEXT, categoria TEXT, precio INTEGER, stock INTEGER);
INSERT INTO productos VALUES
(1,'Pan amasado','Panadería',1500,40),
(2,'Marraqueta (kg)','Panadería',2200,25),
(3,'Leche entera 1L','Lácteos',1190,30),
(4,'Yogurt frutilla','Lácteos',450,60),
(5,'Queso gauda 250g','Lácteos',3290,12),
(6,'Palta hass (kg)','Verdulería',4990,8),
(7,'Tomate (kg)','Verdulería',1890,20),
(8,'Manzana (kg)','Verdulería',1490,35),
(9,'Bebida cola 1,5L','Bebidas',1790,24),
(10,'Jugo naranja 1L','Bebidas',1350,0),
(11,'Té 100 bolsitas','Almacén',2590,15),
(12,'Arroz grado 1 (kg)','Almacén',1390,50),
(13,'Fideos espirales','Almacén',990,45),
(14,'Chocolate en barra','Dulces',1290,18),
(15,'Galletas de agua','Dulces',890,0);
CREATE TABLE clientes (id INTEGER, nombre TEXT, comuna TEXT, edad INTEGER);
INSERT INTO clientes VALUES
(1,'Camila','Providencia',29),(2,'Benjamín','Maipú',41),(3,'Sofía','Ñuñoa',35),(4,'Matías','Maipú',23),
(5,'Valentina','Puente Alto',52),(6,'Tomás','Providencia',67),(7,'Isidora','La Florida',19),(8,'Diego','Ñuñoa',38);
CREATE TABLE ventas (id INTEGER, cliente_id INTEGER, producto_id INTEGER, cantidad INTEGER, fecha TEXT);
INSERT INTO ventas VALUES
(1,1,3,2,'2026-09-01'),(2,2,1,10,'2026-09-01'),(3,3,6,1,'2026-09-02'),(4,1,14,3,'2026-09-02'),
(5,4,9,2,'2026-09-03'),(6,5,12,4,'2026-09-03'),(7,2,7,2,'2026-09-04'),(8,6,11,1,'2026-09-05'),
(9,3,4,6,'2026-09-05'),(10,7,14,2,'2026-09-06'),(11,8,9,3,'2026-09-06'),(12,4,13,5,'2026-09-07'),
(13,1,8,2,'2026-09-08'),(14,5,3,3,'2026-09-08'),(15,2,5,1,'2026-09-09'),(16,8,1,6,'2026-09-10');
`;
const TABLE_INFO = {
  productos: 'Lo que vende el almacén: nombre, categoría, precio en pesos y unidades en bodega (stock).',
  clientes: 'Las personas que compran: nombre, comuna y edad.',
  ventas: 'Cada compra: quién compró (cliente_id), qué compró (producto_id), cuántas unidades y cuándo.'
};

/* ================= LECCIONES ================= */
// type 'choose': {q, options[], answer(index), why}
// type 'write':  {q, solution, ordered, hint, chips[]}
// alt: variantes que rotan cada vez que repites la lección (sobrescriben campos del ejercicio base)
const T = ['productos','clientes','ventas'];
const LESSONS = [
{ id:'tablas', title:'¿Qué es una tabla?', kw:'tablas, filas, columnas', blurb:'Lo primero: cómo se guardan los datos.',
  learn:`<p>Una <b>base de datos</b> es un conjunto de <b>tablas</b>. Cada tabla se parece a una hoja de Excel.</p>
<p>Cada línea horizontal es una <b>fila</b> (un registro: un producto, un cliente). Cada línea vertical es una <b>columna</b> (un dato de ese registro: nombre, precio).</p>
<p><b>SQL</b> es el idioma para hacerle preguntas a esas tablas. En este juego trabajas en un almacén de barrio con 3 tablas.</p>`,
  example:'SELECT * FROM productos;', exampleNote:'Toca "Probar ejemplo" para ver la tabla productos. Todavía no necesitas entender el código.',
  challenges:[
    {type:'choose', q:'En la tabla productos, ¿qué es "Pan amasado, Panadería, 1500, 40"?', options:['Una columna','Una fila','Una tabla'], answer:1, why:'Es una línea horizontal con todos los datos de un producto: una fila.',
      alt:[{q:'En la tabla clientes, ¿qué es "Camila, Providencia, 29"?', why:'Es una línea horizontal con todos los datos de una clienta: una fila.'},
           {q:'En la tabla ventas, ¿qué es "2, 2, 1, 10, 2026-09-01"?', why:'Son todos los datos de una venta en una línea horizontal: una fila.'}]},
    {type:'choose', q:'¿Qué es "precio"?', options:['Una fila','Una base de datos','Una columna'], answer:2, why:'"precio" es un dato que tienen todos los productos: una columna.',
      alt:[{q:'En la tabla clientes, ¿qué es "comuna"?', why:'"comuna" es un dato que tienen todos los clientes: una columna.'},
           {q:'¿Qué es "clientes"?', options:['Una fila','Una tabla','Una columna'], answer:1, why:'"clientes" agrupa las filas y columnas de todas las personas que compran: es una tabla.'}]},
    {type:'choose', q:'¿Cuántas columnas tiene la tabla productos?', options:['3','5','15'], answer:1, why:'id, nombre, categoria, precio y stock: 5 columnas. (15 es el número de filas.)',
      alt:[{q:'¿Cuántas columnas tiene la tabla clientes?', options:['4','8','2'], answer:0, why:'id, nombre, comuna y edad: 4 columnas. (8 es el número de filas.)'},
           {q:'¿Cuántas filas tiene la tabla clientes?', options:['4','8','16'], answer:1, why:'Hay 8 clientes, una fila por cada uno. (4 es el número de columnas.)'}]},
  ]},
{ id:'select', title:'Ver una tabla completa', kw:'SELECT * FROM', blurb:'Tu primera consulta.',
  learn:`<p>Para ver todo lo que hay en una tabla se escribe:</p>
<p><b>SELECT</b> significa "muéstrame". El <b>*</b> (asterisco) significa "todas las columnas". <b>FROM</b> significa "de la tabla".</p>`,
  example:'SELECT * FROM clientes;', exampleNote:'Se lee: "muéstrame todas las columnas de la tabla clientes".',
  challenges:[
    {type:'choose', q:'En SQL, ¿qué significa el * en SELECT * ?', options:['Multiplicar','Todas las columnas','Solo la primera fila'], answer:1, why:'Después de SELECT, el * es un comodín que significa "todas las columnas".',
      alt:[{q:'¿Qué palabra indica de qué tabla se sacan los datos?', options:['SELECT','FROM','*'], answer:1, why:'FROM significa "de la tabla": después de FROM va el nombre de la tabla.'},
           {q:'¿Qué significa SELECT?', options:['Borrar','Muéstrame','Guardar'], answer:1, why:'SELECT pide mostrar datos. No cambia nada de la tabla.'}]},
    {type:'write', q:'Muestra la tabla productos completa (todas sus columnas).', solution:'SELECT * FROM productos', hint:'Igual que el ejemplo, pero con la tabla productos.', chips:['SELECT','*','FROM',...T],

           {q:'Muestra la tabla ventas completa (todas sus columnas).', solution:'SELECT * FROM ventas', hint:'SELECT * FROM y el nombre de la tabla.'}]},

{ id:'order', title:'Ordenar resultados', kw:'ORDER BY · DESC', blurb:'De menor a mayor, o al revés.',

  example:'SELECT nombre, precio FROM productos ORDER BY precio DESC;', exampleNote:'Del más caro al más barato.',
  challenges:[
    {type:'write', q:'Muestra nombre y precio de los productos, del más barato al más caro.', solution:'SELECT nombre, precio FROM productos ORDER BY precio', ordered:true, hint:'ORDER BY precio, sin DESC.', chips:['SELECT','FROM','ORDER BY','DESC',',','productos','clientes','nombre','precio'],

    {type:'write', q:'Muestra nombre y edad de los clientes, del mayor al más joven.', solution:'SELECT nombre, edad FROM clientes ORDER BY edad DESC', ordered:true, hint:'Mayor primero = DESC.', chips:['SELECT','FROM','ORDER BY','DESC',',','clientes','nombre','edad'],

      alt:[{q:'¿Qué hace DESC?', options:['Ordena de mayor a menor','Borra filas','Ordena de menor a mayor'], answer:0, why:'DESC viene de "descendente": de mayor a menor, o de la Z a la A.'},

      alt:[{q:"Muestra el nombre de los productos que empiezan con 'M'.", solution:"SELECT nombre FROM productos WHERE nombre LIKE 'M%'", hint:"WHERE nombre LIKE 'M%'"},
           {q:"Muestra el nombre de los clientes cuyo nombre termina en 'a'.", solution:"SELECT nombre FROM clientes WHERE nombre LIKE '%a'", hint:"Termina en a: el % va antes, '%a'", chips:['SELECT','FROM','WHERE','LIKE','clientes','nombre',"'a%'","'%a'","'%a%'"]}]},
    {type:'choose', q:"¿Qué encuentra LIKE '%1L'?", options:['Textos que empiezan con 1L','Textos que terminan con 1L','Solo el texto exacto 1L'], answer:1, why:'El % está antes, así que puede venir cualquier cosa antes y el texto tiene que terminar en 1L.',

           {q:"¿Qué encuentra LIKE '%queso%'?", options:['Textos que contienen "queso" en cualquier parte','Solo el texto exacto queso','Textos sin queso'], answer:0, why:'Con % a los dos lados, "queso" puede estar al inicio, al medio o al final.'}]},
    {type:'write', q:"Muestra el nombre de los clientes cuyo nombre contiene la letra 'v'.", solution:"SELECT nombre FROM clientes WHERE nombre LIKE '%v%'", hint:"Contiene = % a ambos lados. En este juego LIKE no distingue mayúsculas.", chips:['SELECT','FROM','WHERE','LIKE','clientes','nombre',"'v%'","'%v%'"],

/* ================= LÓGICA DE CORRECCIÓN ================= */
function norm(v){
  if (v === null || v === undefined) return '∅';
  if (typeof v === 'number') return (Math.round(v*100)/100).toString();
  return String(v).trim();
}
function runSQL(db, sql){
  lastSql = sql;
  const res = db.exec(sql);
  if (!res.length) return {columns:[], values:[]};
  return res[res.length-1];
}
function check(db, ch, userSql){
  let got, exp;
  try { got = runSQL(db, userSql); } catch(e){ return {ok:false, error: friendlyError(e.message)}; }
  exp = runSQL(db, ch.solution);
  if (!got.columns.length){
    return {ok:false, got, msg:'Tu consulta no devolvió ninguna fila. Revisa el filtro: los textos tienen que estar escritos igual que en la tabla, con tildes y mayúsculas.'};
  }
  if (got.columns.length !== exp.columns.length){
    return {ok:false, got, msg:`Tu resultado tiene ${got.columns.length} columna${got.columns.length===1?'':'s'} y se esperaban ${exp.columns.length}. Revisa qué pusiste después de SELECT.`};
  }
  if (got.values.length !== exp.values.length){
    return {ok:false, got, msg:`Tu resultado tiene ${got.values.length} fila${got.values.length===1?'':'s'} y se esperaban ${exp.values.length}. Revisa el filtro (WHERE) o el LIMIT.`};
  }
  const g = got.values.map(r => r.map(norm).join('␟'));
  const e = exp.values.map(r => r.map(norm).join('␟'));
  if (ch.ordered){
    const same = g.every((r,i)=>r===e[i]);
    if (!same){
      const ms = [...g].sort().join('|') === [...e].sort().join('|');
      return {ok:false, got, msg: ms ? 'Tienes los datos correctos, pero en otro orden. Revisa el ORDER BY (¿falta o sobra DESC?).' : 'Las filas no son las esperadas. Revisa columnas y filtro.'};
    }
  } else {
    if ([...g].sort().join('|') !== [...e].sort().join('|')) return {ok:false, got, msg:'El resultado no coincide. Revisa las columnas, el filtro y que los textos estén escritos igual (tildes y mayúsculas).'};
  }
  return {ok:true, got};
}
let lastSql = '';
function friendlyError(m){
  if (/no such table/i.test(m)) return 'Esa tabla no existe. Las tablas son: productos, clientes y ventas. ('+m+')';
  const col = (m.match(/no such column: (\w+)/i) || [])[1];
  if (col && T.includes(col.toLowerCase())) return `${col} es el nombre de una tabla, no de una columna. Las tablas van después de FROM: SELECT * FROM ${col}`;
  if (/no such column/i.test(m)) return 'Esa columna no existe. Toca "Ver tablas" para ver los nombres. ('+m+')';
  const near = (m.match(/near "([^"]+)"/) || [])[1];
  if (near && T.includes(near.toLowerCase()) && !/\bFROM\s+$/i.test(lastSql.slice(0, lastSql.toLowerCase().indexOf(near.toLowerCase())))) return `Antes del nombre de la tabla (${near}) va la palabra FROM. Ejemplo: SELECT * FROM ${near}`;
  if (/syntax error/i.test(m)) return 'Hay algo mal escrito cerca de donde indica el mensaje. Revisa comas, comillas y el orden de las palabras. ('+m+')';
  if (/incomplete input/i.test(m)) return 'La consulta quedó incompleta. ¿Falta cerrar una comilla o un paréntesis?';
  return m;
}

function bumpStreak(){
  const t = today();
  if (P.lastDay === t) return;
  const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
  P.streak = (P.lastDay === y) ? P.streak + 1 : 1;
  P.lastDay = t;
}

let DB = null;

/* ================= RENDER ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KW = /\b(SELECT|FROM|WHERE|AND|OR|ORDER BY|GROUP BY|DESC|ASC|LIMIT|LIKE|JOIN|ON|AS|COUNT|SUM|AVG|MAX|MIN)\b/g;
function hl(sql){
  return esc(sql).split(/('[^']*')/).map(p => p.startsWith("'") ? `<span class="s">${p}</span>` : p.replace(KW,'<span class="k">$1</span>')).join('');
}
function tablesIn(sql){
  const found = [];
  (sql || '').replace(/\b(?:FROM|JOIN)\s+([a-z_]+)/gi, (m, t) => { t = t.toLowerCase(); if (T.includes(t) && !found.includes(t)) found.push(t); });
  return found;
}
function tableLabel(sql){
  const ts = tablesIn(sql);
  if (!ts.length) return '';
  return `<div class="tlabel"><span>${ts.length > 1 ? 'Tablas' : 'Tabla'}</span>${ts.map(t => `<b>${t}</b>`).join('<i>+</i>')}</div>`;
}
function usesLine(sql){
  const ts = tablesIn(sql);
  if (!ts.length) return '';
  return `<p class="uses">${ts.length > 1 ? 'Trabajas con las tablas' : 'Trabajas con la tabla'} ${ts.map(t => `<b>${t}</b>`).join(' y ')}</p>`;
}
function tableHTML(r, sql){
  if (!r.columns.length) return tableLabel(sql) + '<p class="result-meta">La consulta no devolvió filas.</p>';
  const head = r.columns.map(c=>`<th>${esc(c)}</th>`).join('');
  const body = r.values.length ? r.values.map(row => '<tr>'+row.map(v => `<td class="${typeof v==='number'?'num':''}">${v===null?'—':esc(typeof v==='number'?norm(v):v)}</td>`).join('')+'</tr>').join('')
    : `<tr><td colspan="${r.columns.length}">Sin filas</td></tr>`;
  return tableLabel(sql) + `<div class="tablewrap${sql?' labeled':''}"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  <p class="result-meta">${r.values.length} fila${r.values.length===1?'':'s'}</p>`;
}
function nextIndex(){ const i = LESSONS.findIndex(l => !P.done[l.id]); return i === -1 ? LESSONS.length-1 : i; }
function statusOf(l){ return !P.done[l.id] ? '' : (P.stats[l.id] && P.stats[l.id].weak ? 'weak' : 'done'); }
function topbar(){

    <div class="reinforce-list">${weak.map(x => `<button class="rf-btn" data-i="${x.i}"><b>${esc(x.l.title)}</b><span>${P.stats[x.l.id].errors} errores la última vez · ${esc(x.l.kw)}</span></button>`).join('')}</div>
  </section>` : ''}
  <ol class="path">${LESSONS.map((l,i)=>{ const st = statusOf(l); return `

      <span class="node">${st==='done'?'✓':st==='weak'?'!':(l.boss?'★':i+1)}</span>
      <button class="lesson-btn" data-i="${i}"><b>${esc(l.title)}</b><span class="kwtag">${esc(l.kw)}</span><span>${esc(l.blurb)}</span>${st==='weak'?`<span class="weak-tag">Por reforzar · ${P.stats[l.id].errors} errores</span>`:''}${P.inprog[l.id] && P.inprog[l.id].step > 0 ? `<span class="prog-tag">En curso · misión ${Math.min(P.inprog[l.id].step, l.challenges.length)} de ${l.challenges.length}</span>`:''}</button>
    </li>`; }).join('')}
  </ol>
  <p style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
    <button class="iconbtn" id="tables">Ver tablas del almacén</button>

function confirmReset(){
  const b = $('#reset');
  if (b.dataset.armed){ P = fresh(); save(); renderMap(); return; }
  b.dataset.armed = '1'; b.textContent = 'Toca otra vez para confirmar';
  setTimeout(()=>{ if (b.isConnected){ delete b.dataset.armed; b.textContent = 'Borrar mi progreso'; } }, 4000);
}

function openLesson(i, restart){
  const id = LESSONS[i].id;
  const saved = !restart && P.inprog[id];
  if (saved){
    S = Object.assign({tries:0, solved:false, draft:'', order:null, sawSol:false, finished:false}, saved, {screen:'lesson', li:i});
  } else {
    const run = P.runs[id] || 0;
    P.runs[id] = run + 1;
    S = {screen:'lesson', li:i, run, step:0, maxStep:0, solvedSteps:[], tries:0, solved:false, draft:'', lessonXp:0, errors:0, missed:[], order:null, sawSol:false, finished:false};
    persist();
  }
  renderLesson();
}
// Guarda la lección a medio camino para retomarla desde el mapa
function persist(){
  if (S.screen !== 'lesson' || S.finished) return;
  const id = LESSONS[S.li].id;
  P.inprog[id] = {run:S.run, step:S.step, maxStep:S.maxStep, solvedSteps:S.solvedSteps, errors:S.errors, missed:S.missed, lessonXp:S.lessonXp};
  save();
}
const isPractice = () => S.finished || S.solvedSteps.includes(S.step);
function goTo(step){
  const l = LESSONS[S.li];
  if (step < 0 || step > S.maxStep || step > l.challenges.length + 1) return;
  S.step = step; resetStep(); persist(); renderLesson(); window.scrollTo(0,0);
}
// Elige la variante del ejercicio según cuántas veces has abierto la lección
function getCh(l, idx){
  const base = l.challenges[idx];
  const alts = base.alt || [];
  const k = (S.run + idx) % (alts.length + 1);
  return k === 0 ? base : Object.assign({}, base, alts[k-1]);
}
function markError(ch){
  if (isPractice()) return;
  S.errors++;
  if (!S.missed.includes(ch.q)) S.missed.push(ch.q);
}
function stepsCount(l){ return l.challenges.length + 1; }
function header(l){
  const n = l.challenges.length;
  const chips = [];
  for (let s = 0; s <= n; s++){
    const solved = s > 0 && S.solvedSteps.includes(s);
    const cls = [s === S.step ? 'cur' : '', solved ? 'ok' : '', s === 0 ? 'learn' : ''].join(' ');
    const label = s === 0 ? 'Aprende' : String(s);
    const aria = s === 0 ? 'Ir a la explicación' : `Ir a la misión ${s}${solved ? ' (lograda)' : ''}`;
    chips.push(`<button class="stp ${cls}" data-s="${s}" ${s > S.maxStep ? 'disabled' : ''} aria-label="${aria}" ${s===S.step?'aria-current="step"':''}>${solved && s !== S.step ? '✓' : label}</button>`);
  }
  return `<div class="lesson-head"><button class="back" id="back">← Mapa</button><nav class="steps" aria-label="Partes de la lección">${chips.join('')}</nav><button class="iconbtn" id="tables">Tablas</button></div>`;
}
function renderLesson(){
  const l = LESSONS[S.li];
  if (S.step === 0) return renderLearn(l);
  if (S.step > l.challenges.length) return renderDone(l);
  const ch = getCh(l, S.step-1);
  ch.type === 'choose' ? renderChoose(l, ch) : renderWrite(l, ch);
}
function wireCommon(){

function renderLearn(l){

  <section class="card">

  </section>`;
  wireCommon();
  setActions((l.example ? `<button class="btn ghost" id="try">Probar ejemplo</button>` : '') + `<button class="btn primary" id="next">Vamos</button>`);
  if (l.example) $('#try').onclick = () => { $('#exout').innerHTML = '<div class="result">'+tableHTML(runSQL(DB, l.example), l.example)+'</div>'; };
  $('#next').onclick = () => { S.maxStep = Math.max(S.maxStep, 1); goTo(1); };
  window.scrollTo(0,0);

function resetStep(){ S.tries = 0; S.solved = false; S.draft = ''; S.order = null; S.sawSol = false; }
function award(){
  if (isPractice()) return 0;
  const gain = S.tries === 0 ? XP_PER : Math.max(4, XP_PER - 3*S.tries);
  P.xp += gain; S.lessonXp += gain; bumpStreak();
  if (!S.solvedSteps.includes(S.step)) S.solvedSteps.push(S.step);
  persist(); save();
  return gain;
}
function goNext(){ S.maxStep = Math.max(S.maxStep, S.step + 1); goTo(S.step + 1); }
function shuffled(n){ const a = [...Array(n).keys()]; for (let i=n-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }
function renderChoose(l, ch){
  if (!S.order || S.order.length !== ch.options.length) S.order = shuffled(ch.options.length);
  $('#app').innerHTML = header(l) + `
  <section class="card">
    <span class="eyebrow">Misión ${S.step} de ${l.challenges.length} · Elige${isPractice()?' · Práctica, no suma errores':''}</span>
    <p class="q">${esc(ch.q)}</p>
    <div class="opts">${S.order.map(i => { const o = ch.options[i]; return `<button class="opt" data-i="${i}">${/[=<>*']|SELECT|WHERE/.test(o)?`<code>${esc(o)}</code>`:esc(o)}</button>`; }).join('')}</div>
    <div id="fb"></div>
  </section>`;
  wireCommon();
  setActions(`<button class="btn primary" id="next" disabled>Elige una opción</button>`);
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (S.solved) return;
    const i = +b.dataset.i;
    if (i === ch.answer){
      b.classList.add('right'); S.solved = true;
      document.querySelectorAll('.opt').forEach(x => x.disabled = true);
      const pr = isPractice(); const g = award();
      $('#fb').innerHTML = `<div class="feedback ok"><strong>¡Correcto!${pr ? ' (práctica)' : ` +${g} XP`}</strong><p>${esc(ch.why)}</p></div>`;
      setActions(`<button class="btn primary" id="next">Siguiente</button>`);
      $('#next').onclick = goNext; $('#next').focus();
    } else {
      b.classList.add('wrong'); b.disabled = true; S.tries++; markError(ch); persist();
      $('#fb').innerHTML = `<div class="feedback no"><strong>Esa no es.</strong><p>Prueba con otra opción.</p></div>`;
    }
  });
}
function renderWrite(l, ch){
  $('#app').innerHTML = header(l) + `
  <section class="card">
    <span class="eyebrow">Misión ${S.step} de ${l.challenges.length} · Escribe${isPractice()?' · Práctica, no suma errores':''}</span>
    <p class="q">${esc(ch.q)}</p>
    ${usesLine(ch.solution)}
    <label for="ed" class="chips-label">Tu consulta (puedes escribir o tocar los bloques)</label>
    <textarea id="ed" class="editor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" placeholder="SELECT …">${esc(S.draft)}</textarea>
    <div class="chips">${ch.chips.map(c=>`<button class="chip ${/^[A-Z]/.test(c)?'kw':''}" data-t="${esc(c)}">${esc(c)}</button>`).join('')}
      <button class="chip tool" data-act="undo" aria-label="Borrar última palabra">⌫ palabra</button><button class="chip tool" data-act="clear">Limpiar</button></div>
    <div id="out"></div>
    <div id="fb"></div>
  </section>`;
  wireCommon();
  const ed = $('#ed');
  ed.oninput = () => { S.draft = ed.value; };
  ed.onkeydown = e => { if ((e.ctrlKey||e.metaKey) && e.key === 'Enter'){ e.preventDefault(); submit(); } };
  document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    if (ed.readOnly) return;
    if (b.dataset.act === 'clear'){ ed.value = ''; }
    else if (b.dataset.act === 'undo'){ ed.value = ed.value.replace(/\s*\S+\s*$/, ''); ed.value += ed.value ? ' ' : ''; }
    else {
      const t = b.dataset.t, v = ed.value;
      const noSpaceBefore = /^[,)]$/.test(t) || /\($/.test(v);
      ed.value = (noSpaceBefore ? v.replace(/\s+$/,'') : (v && !/\s$/.test(v) ? v+' ' : v)) + t + (/\($/.test(t) ? '' : ' ');
    }
    S.draft = ed.value;
  });
  setActions(`<button class="btn ghost" id="run">Ejecutar</button><button class="btn primary" id="chk">Comprobar</button>`);
  $('#run').onclick = () => {
    const sql = ed.value.trim(); if (!sql) return;
    try { $('#out').innerHTML = '<div class="result"><span class="result-meta">Tu resultado</span>'+tableHTML(runSQL(DB, sql), sql)+'</div>'; }
    catch(e){ $('#out').innerHTML = `<div class="err">${esc(friendlyError(e.message))}</div>`; }
  };
  $('#chk').onclick = submit;
  function submit(){
    if (S.solved) return goNext();
    const sql = ed.value.trim();
    if (!sql){ $('#fb').innerHTML = `<div class="feedback no"><strong>Falta la consulta.</strong><p>Escribe algo o toca los bloques de abajo.</p></div>`; return; }
    const r = check(DB, ch, sql);
    $('#out').innerHTML = r.got ? '<div class="result"><span class="result-meta">Tu resultado</span>'+tableHTML(r.got, sql)+'</div>' : '';
    if (r.ok){
      S.solved = true; const pr = isPractice(); const g = award();
      $('#fb').innerHTML = `<div class="feedback ok"><strong>¡Lo lograste!${pr ? ' (práctica)' : ` +${g} XP`}</strong></div>`;
      ed.readOnly = true;
      setActions(`<button class="btn primary" id="next">Siguiente</button>`);
      $('#next').onclick = goNext; $('#next').focus();
    } else {
      S.tries++; markError(ch); persist();
      const msg = r.error ? r.error : r.msg;
      $('#fb').innerHTML = `<div class="feedback no"><strong>Casi. Intenta de nuevo.</strong><p>${esc(msg)}</p>
        <button class="linkbtn" id="hint">Ver pista</button>
        ${S.tries >= 2 ? `<button class="linkbtn" id="sol">Ver una solución (cuenta como error)</button>` : ''}
        <div id="extra"></div></div>`;
      $('#hint').onclick = () => { $('#extra').innerHTML = `<p class="tip">${esc(ch.hint)}</p>`; };
      const so = $('#sol'); if (so) so.onclick = () => {
        if (!S.sawSol){ S.sawSol = true; S.errors++; }
        $('#extra').innerHTML = `<div class="sql">${hl(ch.solution)}</div><p class="tip">Cópiala a mano para practicar y toca Comprobar.</p>`;
      };
    }
  }
  if (!('ontouchstart' in window)) ed.focus();
}
const WEAK_AT = 2; // con 2 o más errores la lección queda "por reforzar"
function renderDone(l){
  if (!S.finished){
    S.finished = true;
    const weak = S.errors >= WEAK_AT;
    P.done[l.id] = true;
    P.stats[l.id] = {errors: S.errors, weak, missed: S.missed.slice(0, 4), at: today()};
    delete P.inprog[l.id];
    save();
  }
  const st = P.stats[l.id], weak = st.weak;
  const last = S.li === LESSONS.length - 1;
  const nextWeak = LESSONS.findIndex((x,i) => i !== S.li && statusOf(x) === 'weak');
  S.maxStep = l.challenges.length + 1;
  $('#app').innerHTML = header(l) + `
  <section class="card done-card ${weak?'is-weak':''}">
    <div class="stamp">${weak ? '!' : '+'+S.lessonXp}</div>
    <h2>${weak ? 'Lección completada, queda por reforzar' : last ? '¡Terminaste Foco SQL!' : '¡Lección lista!'}</h2>
    ${weak ? `<p style="max-width:48ch">Tuviste <b>${st.errors} errores</b> en <b>${esc(l.kw)}</b>. Quedará marcada en el mapa hasta que la pases con 1 error o menos. La próxima vez los ejercicios serán distintos.</p>
      <p class="tip" style="text-align:left">Toca un número arriba para volver a practicar esa misión.</p>
      ${st.missed.length ? `<div class="missed"><span class="eyebrow">Te costó</span><ul>${st.missed.map(q=>`<li>${esc(q)}</li>`).join('')}</ul></div>` : ''}`
    : `<p style="color:var(--muted);max-width:44ch">${last ? 'Ya sabes consultar, filtrar, ordenar, resumir y unir tablas. Eso es la base del SQL que se usa en el trabajo.' : `Dominaste <b>${esc(l.kw)}</b>${st.errors===0?' sin errores':' con solo 1 error'}. ${P.streak>1?`Llevas ${P.streak} días seguidos.`:'Vuelve mañana para empezar una racha.'}`}</p>`}
  </section>`;
  let acts = `<button class="btn ghost" id="map">Mapa</button>`;
  if (weak) acts += `<button class="btn ghost" id="again">Repetir ahora</button>`;
  if (!last) acts += `<button class="btn primary" id="nx">Siguiente lección</button>`;
  else if (nextWeak !== -1) acts += `<button class="btn primary" id="rf">Reforzar otra</button>`;
  setActions(acts);
  wireCommon();
  $('#map').onclick = renderMap;
  const nx = $('#nx'); if (nx) nx.onclick = () => openLesson(S.li+1);
  const ag = $('#again'); if (ag) ag.onclick = () => openLesson(S.li);
  const rf = $('#rf'); if (rf) rf.onclick = () => openLesson(nextWeak);
  window.scrollTo(0,0);
}
function openTables(){
  const d = $('#drawer');
  d.innerHTML = `<div class="sheet" role="dialog" aria-label="Tablas del almacén">
    <div class="sheet-head"><h3>Tablas del almacén</h3><button class="iconbtn" id="close">Cerrar</button></div>
    ${T.map(t => `<div class="result"><span class="tname">${t}</span><span class="tdesc">${TABLE_INFO[t]}</span>${tableHTML(runSQL(DB,'SELECT * FROM '+t))}</div>`).join('')}
  </div>`;
  d.hidden = false;
  $('#close').onclick = () => d.hidden = true;
  d.onclick = e => { if (e.target === d) d.hidden = true; };
  $('#close').focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('#drawer').hidden = true; });

/* ================= ARRANQUE ================= */
function start(data){
  if (data && data.S) S = Object.assign({}, S, data.S);
  if (typeof initSqlJs !== 'function'){
    $('#app').innerHTML = topbar() + '<div class="err">No se pudo cargar el motor de SQL. Cierra y vuelve a abrir la app.</div>';
    return;
  }
  initSqlJs().then(SQL => {
    DB = new SQL.Database(); DB.run(SEED);
    S.screen === 'lesson' ? renderLesson() : renderMap();
  }).catch(() => { $('#app').innerHTML = topbar() + '<div class="err">No se pudo iniciar la base de datos. Recarga la página.</div>'; });
}
window.claude?.hot?.snapshot?.(() => ({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
