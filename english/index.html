<!doctype html><html lang="es"><head><script src="../perfil.js" data-modulo="english"></script><meta name="theme-color" content="#16213A"><link rel="manifest" href="../manifest.json"><link rel="icon" type="image/png" href="../iconos/favicon.png"><link rel="apple-touch-icon" href="../iconos/apple-touch-icon.png"><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Foco English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una sola columna estrecha (sin distracciones laterales), una tarea visible a la vez, barra de progreso siempre arriba */
:root{
  --bg:#EDF2F0; --surface:#FFFFFF; --ink:#16213A; --muted:#566476; --line:#D3DDD9; --chip:#E1E9E6;
  --accent:#F2541B; --accent-ink:#FFFFFF; --teal:#0C8F80; --good:#17894E; --good-soft:#D6F2E2;
  --bad:#C9372F; --bad-soft:#FBE1DE; --gold:#D99A00; --gold-soft:#FFF1CC;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151F; --surface:#172130; --ink:#E8EFEC; --muted:#9AA8B6; --line:#2A3748; --chip:#212D3D;
  --accent:#FF7442; --accent-ink:#1A0C05; --teal:#2DBFAC; --good:#3CC47A; --good-soft:#15352A;
  --bad:#F0685F; --bad-soft:#3A1E1F; --gold:#F5BF2A; --gold-soft:#3A3014; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151F; --surface:#172130; --ink:#E8EFEC; --muted:#9AA8B6; --line:#2A3748; --chip:#212D3D;
  --accent:#FF7442; --accent-ink:#1A0C05; --teal:#2DBFAC; --good:#3CC47A; --good-soft:#15352A;
  --bad:#F0685F; --bad-soft:#3A1E1F; --gold:#F5BF2A; --gold-soft:#3A3014; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;padding-inline:16px;padding-block:0 120px}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;align-items:center;gap:12px}
.lvl{display:grid;place-items:center;min-width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:18px}
.xpwrap{flex:1;min-width:0}
.xpbar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--gold);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:14px}
.pill svg{width:16px;height:16px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="false"]{opacity:.5}

/* Home */
.hero{padding-block:18px 8px;display:grid;gap:14px}
.hero h1{font-size:clamp(30px,8vw,44px);font-weight:800;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--accent)}
.goal{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.ring{width:58px;height:58px;flex:none}
.goal p{margin:2px 0 0;color:var(--muted);font-size:15px}
.path{display:grid;gap:10px;margin-top:18px}
.unit{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);transition:transform .12s}
.unit:not(:disabled):hover{transform:translateY(-2px);border-color:var(--ink)}
.unit:disabled{opacity:.55;cursor:not-allowed}
.unit .badge{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;background:var(--chip)}
.unit.cur .badge{background:var(--accent);color:var(--accent-ink)}
.unit.done .badge{background:var(--good);color:var(--surface)}
.unit h3{font-size:18px;font-weight:800}
.unit small{color:var(--muted);font-size:14px;display:block}
.unit>span{display:block;min-width:0}
.btn svg{width:20px;height:20px;flex:none}
.mbar{display:block;height:6px;border-radius:99px;background:var(--chip);margin-top:6px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--teal)}
.unit .go{font-size:13px;font-weight:700;color:var(--muted)}
.unit svg{width:18px;height:18px}
details.why{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px}
details.why summary{cursor:pointer;font-weight:700;padding-block:12px;font-family:var(--f-display);font-size:17px}
.why ol{padding-left:20px;margin:4px 0 12px;display:grid;gap:12px}
.why li p{margin:2px 0 0;color:var(--muted);font-size:15px;max-width:62ch}
.why a{color:var(--teal)}
.note{font-size:14px;color:var(--muted);margin:0 0 14px}

/* Play */
.play{padding-top:6px}
.qhead{display:flex;align-items:center;gap:10px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:99px;background:var(--chip);transition:background .25s}
.segs i.ok{background:var(--good)} .segs i.no{background:var(--bad)} .segs i.now{background:var(--ink)}
.combo{font-family:var(--f-display);font-weight:800;font-size:20px;min-width:52px;text-align:right;color:var(--muted)}
.combo.hot{color:var(--accent)}
.combo.pop{animation:pop .35s}
.timer{height:4px;border-radius:99px;background:var(--chip);margin-top:8px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--teal);transform-origin:left}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 18px;display:grid;gap:10px;text-align:center;position:relative}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1.1;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:16px}
.speak{justify-self:center;display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--chip);font-weight:700}
.speak svg{width:20px;height:20px}
.speak.huge{padding:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.speak.huge svg{width:40px;height:40px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.opt{min-height:64px;padding:12px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;text-align:left;transition:transform .08s}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12px;background:var(--chip);color:var(--muted)}
.opt:not(:disabled):active{transform:translateY(3px);border-bottom-width:2px}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt.right{background:var(--good-soft);border-color:var(--good);animation:pop .3s}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);animation:shake .3s}
.opt:disabled{cursor:default}
.cloze{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6.5vw,32px);line-height:1.2}
.cloze u{text-decoration:none;display:inline-block;min-width:70px;border-bottom:4px solid var(--accent);color:var(--accent)}
.line{min-height:62px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;justify-content:center;align-content:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.chip{padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:700;font-size:17px}
.chip.used{visibility:hidden}
.line .chip{background:var(--chip)}
.check{margin-top:16px;width:100%}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.match .col{display:grid;gap:10px}
.mt{min-height:56px;padding:10px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;font-weight:700;font-size:16px;transition:opacity .3s,transform .3s}
.mt.sel{border-color:var(--teal);background:var(--chip)}
.mt.gone{opacity:0;transform:scale(.9);pointer-events:none}
.mt.bad{border-color:var(--bad);animation:shake .3s}
.float{position:absolute;right:18px;top:12px;font-family:var(--f-display);font-weight:800;color:var(--gold);font-size:22px;animation:rise .9s forwards;pointer-events:none}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:var(--r);font-weight:800;font-family:var(--f-display);font-size:18px;background:var(--accent);color:var(--accent-ink);border-bottom:5px solid color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);border-bottom-width:5px}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 160px}

/* Feedback bar */
.fb{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.fb.show{transform:none}
.fb.ok{background:var(--good-soft);border-top:3px solid var(--good)}
.fb.no{background:var(--bad-soft);border-top:3px solid var(--bad)}
.fb .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fb .msg{flex:1 1 220px;min-width:0}
.fb strong{font-family:var(--f-display);font-size:21px;display:block}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb span{font-size:15px}

/* Learn / result / break */
.center{display:grid;gap:16px;text-align:center;padding-top:14px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--chip)} .dots i.on{background:var(--accent)}
.rule{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:14px;text-align:left;font-size:16px}
.rule b{font-family:var(--f-display)}
.stars{display:flex;justify-content:center;gap:8px}
.stars svg{width:62px;height:62px}
.stars svg.on{animation:starin .5s both}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px}
.stat b{display:block;font-size:26px;font-family:var(--f-display)}
.stat span{font-size:13px;color:var(--muted)}
.chest{background:var(--gold-soft);border:2px dashed var(--gold);border-radius:var(--r);padding:14px;font-weight:700}
.chest svg{width:48px;height:48px;display:block;margin:0 auto 6px}
.chest.open svg{animation:wiggle .6s}
.brk{width:180px;height:180px;margin:0 auto}
.lvup{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 85%,transparent);animation:fade .2s}
.lvup div{text-align:center;display:grid;gap:8px}
.lvup b{font-family:var(--f-display);font-size:88px;line-height:1;color:var(--accent);animation:pop .5s}

/* Mundos y MCER */
.world{margin-top:26px;display:grid;gap:10px}
.world .path{margin-top:0}
.whead{display:flex;gap:12px;align-items:center}
.whead h2{font-size:22px;font-weight:800}
.whead small{color:var(--muted);font-size:14px}
.cefr{flex:none;display:grid;place-items:center;min-width:52px;height:40px;padding:0 8px;border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--f-display);font-weight:800;font-size:16px}
.mcer{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.mcer p{margin:0;font-size:15px;color:var(--muted)}
.ladder{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end}
.step{height:var(--h);border-radius:8px 8px 4px 4px;background:var(--chip);display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:4px 2px;text-align:center}
.step b{font-family:var(--f-display);font-size:15px}
.step span{font-size:9.5px;line-height:1.1;color:var(--muted)}
.step.in{background:var(--teal);color:var(--surface)}
.step.in span{color:var(--surface)}
.step.part{background:color-mix(in srgb,var(--teal) 30%,var(--chip))}
.step span{overflow-wrap:anywhere}
.hint{margin:0;font-size:14px;color:var(--muted)}
.addrow .age{flex:0 0 84px;width:84px}
@media (max-width:420px){.addrow{flex-wrap:wrap}.addrow input#pname{flex:1 1 100%}.addrow .age{flex:1 1 auto}}
/* Jugadores */
.av{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;color:var(--surface);font-family:var(--f-display);font-weight:800;font-size:19px}
.tn{text-transform:none;letter-spacing:0;color:var(--ink);font-size:13px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;padding-block:8px}
.plist{display:grid;gap:10px;text-align:left}
.prow{display:flex;gap:8px;align-items:stretch}
.pbtn{flex:1;min-width:0;display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);border-bottom-width:5px}
.pbtn:hover{border-color:var(--ink)}
.pn{min-width:0}
.pn b{font-family:var(--f-display);font-size:20px;display:block;overflow-wrap:anywhere}
.pn small{color:var(--muted);font-size:14px}
.pdel{padding:0 14px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-weight:700;border:2px solid var(--bad)}
.addf{display:grid;gap:8px;text-align:left;background:var(--surface);border:2px dashed var(--line);border-radius:var(--r);padding:14px}
.addrow{display:flex;gap:8px}
.center{grid-template-columns:minmax(0,1fr)}
.addrow input{flex:1;min-width:0;width:100%;font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.addrow input:focus-visible{outline:3px solid var(--teal);outline-offset:1px}
.err{color:var(--bad);margin:0;font-weight:700;font-size:15px}
.prof .link{justify-self:center}
/* Plan si-entonces, progreso real, mini-hitos */
.plan{background:var(--surface);border:2px dashed var(--teal);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.plan p{margin:0}
.plan.set{border-style:solid;grid-template-columns:1fr auto;align-items:center}
.plan .chips{justify-content:flex-start;margin:0}
.plan .chip{font-size:15px;padding:8px 12px}
.link{color:var(--teal);font-weight:700;text-decoration:underline;padding:6px}
.known{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kn b{font-family:var(--f-display);font-size:32px;display:block;line-height:1.05}
.kn span{font-size:14px;color:var(--muted)}
.ex{grid-column:1/-1;margin:0;background:var(--good-soft);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:17px;overflow-wrap:anywhere}
.ex .label{display:block;margin-bottom:2px}
.ex.muted{background:var(--chip);font-weight:400;font-size:15px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:15;background:var(--gold-soft);border:2px solid var(--gold);color:var(--ink);padding:8px 16px;border-radius:99px;font-weight:800;font-family:var(--f-display);white-space:nowrap;animation:toast 1.3s forwards;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes rise{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-40px)}}
@keyframes starin{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.opts{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app"></main>
</div>
<div class="fb" id="fb" role="status" aria-live="polite"><div class="in"><div class="msg" id="fbmsg"></div><button class="btn" id="fbbtn">Continuar</button></div></div>

<script>
/* ---------- Contenido: inglés básico, con foco en trabajo ---------- */
const UNITS=[
 {id:'greet',name:'Saludos',tag:'Hi!',items:[['hello','hola'],['good morning','buenos días'],['good afternoon','buenas tardes'],['goodbye','adiós'],['please','por favor'],['thank you','gracias'],['sorry','perdón'],['see you tomorrow','nos vemos mañana'],['How are you?','¿Cómo estás?'],['Nice to meet you','mucho gusto']],
  cloze:[{q:'Thank ___ very much.',a:'you',o:['you','me','we'],es:'Muchas gracias.'},{q:'Good ___! (9 a.m.)',a:'morning',o:['morning','night','afternoon'],es:'¡Buenos días!'},{q:'See you ___.',a:'tomorrow',o:['tomorrow','please','sorry'],es:'Nos vemos mañana.'}],
  sent:[['Nice to meet you','Mucho gusto'],['Good morning, how are you?','Buenos días, ¿cómo estás?']]},
 {id:'be',name:'Verbo to be',tag:'am',rule:'<b>to be</b> = ser / estar. <b>I am</b> · <b>he / she / it is</b> · <b>you / we / they are</b>. Para negar, agrega <b>not</b>: I am not.',
  items:[['I am','yo soy / estoy'],['you are','tú eres / estás'],['he is','él es / está'],['she is','ella es / está'],['it is','eso es / está'],['we are','nosotros somos'],['they are','ellos son / están'],['I am not','yo no soy / no estoy']],
  cloze:[{q:'She ___ a doctor.',a:'is',o:['am','is','are'],es:'Ella es doctora.'},{q:'We ___ in the office.',a:'are',o:['is','am','are'],es:'Estamos en la oficina.'},{q:'I ___ tired.',a:'am',o:['am','is','are'],es:'Estoy cansado.'},{q:'They ___ engineers.',a:'are',o:['is','are','am'],es:'Ellos son ingenieros.'},{q:'It ___ Monday.',a:'is',o:['are','am','is'],es:'Es lunes.'},{q:'He ___ not here.',a:'is',o:['is','are','am'],es:'Él no está aquí.'}],
  sent:[['I am in a meeting','Estoy en una reunión'],['She is my teacher','Ella es mi profesora'],['They are not here','Ellos no están aquí']]},
 {id:'num',name:'Números',tag:'1·2·3',items:[['one','uno'],['two','dos'],['three','tres'],['four','cuatro'],['five','cinco'],['six','seis'],['seven','siete'],['eight','ocho'],['nine','nueve'],['ten','diez'],['twenty','veinte'],['one hundred','cien']],

 <details class="why"><summary>Por qué está diseñado así</summary>
  <p class="note">Cada mecánica sale de un hallazgo publicado. La mayoría de estos estudios se hicieron con niños y adolescentes; en adultos la evidencia es más escasa, así que tómalo como diseño bien fundamentado, no como tratamiento.</p>
  <ol>
   <li><b>Respuesta inmediata, puntos y niveles.</b><p>Un ensayo aleatorizado de 8 semanas (Frontiers in Education, 2025) comparó las mismas tareas con y sin retroalimentación inmediata, puntos y niveles: el grupo con juego mejoró más la atención sostenida y el rendimiento, y la mejora se mantuvo en el seguimiento. <a href="https://www.frontiersin.org/journals/education/articles/10.3389/feduc.2025.1668260/epub" target="_blank" rel="noopener">Ver estudio</a></p></li>
   <li><b>Rondas cortas y sin esperas.</b><p>El equipo de Edmund Sonuga-Barke (Universidad de Southampton) describe la "aversión a la espera": en TDAH, las demoras generan frustración y desconexión, y las tareas largas y monótonas aumentan la inatención. Por eso cada ronda dura unos 2 minutos, los aciertos avanzan solos y nunca hay pantallas de carga. <a href="https://acamh.onlinelibrary.wiley.com/doi/10.1111/jcpp.12868" target="_blank" rel="noopener">JCPP 2018</a> · <a href="https://journals.sagepub.com/doi/abs/10.1177/1087054718772138" target="_blank" rel="noopener">Metaanálisis 2021</a></p></li>
   <li><b>Recompensas pequeñas y frecuentes, no grandes y lejanas.</b><p>El metaanálisis de Marx, Cortese y Sonuga-Barke confirma que en TDAH se prefieren recompensas inmediatas aunque sean menores. Aquí ganas XP en cada acierto, subes el combo cada 3 seguidos y a veces aparece un cofre sorpresa.</p></li>
   <li><b>Premio + palabras de aliento.</b><p>En un estudio con juegos serios (JMIR Serious Games, 2025), combinar monedas con ánimo verbal fue más efectivo que cualquiera por separado. Por eso cada acierto trae XP y un mensaje, y los errores se tratan sin castigo: la palabra vuelve al final de la ronda.</p></li>
   <li><b>Poca carga en la memoria de trabajo y cero ruido de fondo.</b><p>La memoria de trabajo es una dificultad central en TDAH, y un estudio de la Universidad de Linköping (2021) mostró que adultos con TDAH filtran peor los sonidos irrelevantes cuando la tarea exige memoria. Una pregunta a la vez, 3 o 4 opciones y sonido solo como respuesta a tus acciones. <a href="https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2021.771711/pdf" target="_blank" rel="noopener">Ver estudio</a></p></li>
   <li><b>Hacer, no solo mirar.</b><p>Yang y colegas (Frontiers in Psychology, 2017) encontraron que en niños con TDAH la memoria de instrucciones mejora cuando hay acción física al aprender y al recordar. Por eso armas frases tocando palabras, emparejas, y en la fase de aprender se te pide repetir en voz alta. <a href="https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5258743/" target="_blank" rel="noopener">Ver estudio</a></p></li>
   <li><b>Variedad constante.</b><p>Cada ronda mezcla 6 formatos (traducir, escuchar, completar, ordenar, emparejar) para que el cerebro no se habitúe. Cada 3 rondas aparece una pausa activa de 20 segundos.</p></li>
   <li><b>Repaso espaciado entre días.</b><p>Intentar recordar rinde más que releer, y los estudios con universitarios con TDAH muestran que también les funciona (Knouse y colegas; Stern y Halamish, 2023). Cada acierto aleja el próximo repaso (1, 2, 4, 7 y 14 días) y cada error lo trae de vuelta a hoy. <a href="https://www.researchgate.net/publication/276830824_Does_Testing_Improve_Learning_for_College_Students_With_Attention-DeficitHyperactivity_Disorder" target="_blank" rel="noopener">Ver estudio</a></p></li>
   <li><b>Premios frecuentes, castigos suaves.</b><p>El grupo de Luman y Oosterlaan (VU Ámsterdam, 2008) encontró que en TDAH pesa más la frecuencia de premios y castigos que su tamaño. Por eso hay un mini-premio cada 3 preguntas, cofres más seguidos y más chicos, y un error solo baja el combo un nivel. <a href="https://acamh.onlinelibrary.wiley.com/doi/10.1111/j.1469-7610.2008.01910.x" target="_blank" rel="noopener">Ver estudio</a></p></li>
   <li><b>Plan "si… entonces".</b><p>Gawrilow y Gollwitzer mostraron que formular un plan concreto ("si pasa X, entonces hago Y") mejora el autocontrol en TDAH, y que el efecto se suma al de la medicación. Por eso el juego te pide elegir tu momento del día. <a href="https://www.frontiersin.org/journals/human-neuroscience/articles/10.3389/fnhum.2015.00395/full" target="_blank" rel="noopener">Ver revisión</a></p></li>
   <li><b>Progreso real, no solo puntos.</b><p>Hanus y Fox (2015) vieron que en un curso con insignias y rankings la motivación cayó a mitad de semestre. Por eso el inicio muestra cuántas palabras y frases ya dominas y un ejemplo de lo que ya puedes escribir, y no hay ranking entre jugadores. <a href="https://www.academia.edu/12454798/Assessing_the_Effects_of_Gamification_in_the_Classroom_A_Longitudinal_Study_on_Intrinsic_Motivation_Social_Comparison_Satisfaction_Effort_and_Academic_Performance" target="_blank" rel="noopener">Ver estudio</a></p></li>
  </ol>
 </details>`;

/* ---------- Ronda ---------- */
let R=null,sessionRounds=0,timerRAF=0;
function weightedCard(pool,avoid){const w=pool.map(c=>(c.key===avoid?0:1)*(5-Math.min(box(c.key),4)));let t=w.reduce((a,b)=>a+b,0)||1,r=Math.random()*t;for(let k=0;k<pool.length;k++){r-=w[k];if(r<=0)return pool[k]}return pool[0]}
function typesFor(c){if(c.kind==='cloze')return['cloze'];if(c.kind==='sent')return['order'];const t=['en2es','es2en'];if(canSpeak)t.push('listen');return t}
function buildQueue(pool,N=10){const items=pool.filter(c=>c.kind==='item'),q=[];let lastType='',lastKey='';
 for(let n=0;n<N;n++){
  if((n===3||n===7)&&items.length>=4){q.push({type:'match',cards:shuffle(items).slice(0,4)});lastType='match';continue}
  const c=weightedCard(pool,lastKey);let ts=typesFor(c).filter(t=>t!==lastType);if(!ts.length)ts=typesFor(c);
  const t=pick(ts);q.push({type:t,card:c});lastType=t;lastKey=c.key}
 return q}
function startRound(u){closeFb();R={u,q:u.review?buildQueue(u.pool,Math.min(10,Math.max(5,u.pool.length))):buildQueue(cardsOf(u)),i:0,res:[],xp:0,combo:0,best:0,retries:0};renderTop();ask()}
function dueCards(){return UNITS.filter(u=>unlocked(u)&&S.learned[u.id]).flatMap(cardsOf).filter(c=>S.due[c.key]&&S.due[c.key]<=TODAY)}
function startReview(){const pool=dueCards();if(!pool.length)return quickStart();startRound({id:'review',name:'Repaso del día',review:true,pool,items:[]})}
function curUnit(){const m=mainUnits();return m.find(u=>unlocked(u)&&mastery(u)<UNLOCK)||m.filter(unlocked).pop()||m[0]}
function quickStart(){const u=curUnit();S.learned[u.id]?startRound(u):learn(u)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}
function milestone(){R.xp+=5;addXP(5);[784,988,1319].forEach((f,k)=>tone(f,.08,'sine',k*.05,.1));toast(pick(['+5 XP por constancia','+5 XP · Sigues firme','+5 XP · Buen ritmo']))}
function comboMult(){return 1+Math.min(Math.floor(R.combo/3),3)}

function head(){return `<div class="qhead"><button class="iconbtn" id="quit" aria-label="Salir de la ronda">✕</button>
 <div class="segs">${R.q.map((_,k)=>`<i class="${R.res[k]===true?'ok':R.res[k]===false?'no':k===R.i?'now':''}"></i>`).join('')}</div>
 <div class="combo ${R.combo>=3?'hot':''}" id="combo">x${comboMult()}</div></div>
 ${S.turbo?'<div class="timer"><i id="tbar"></i></div>':''}`}

function distract(field,correct,u,n){let pool=u.items.map(x=>field==='en'?x[0]:x[1]).filter(x=>x!==correct);
 if(pool.length<n)pool=pool.concat(UNITS.flatMap(v=>v.items.map(x=>field==='en'?x[0]:x[1])).filter(x=>x!==correct&&!pool.includes(x)));
 return shuffle(pool).slice(0,n)}

function ask(){
 if(R.i>=R.q.length)return finish();
 const Q=R.q[R.i];R.t0=Date.now();R.locked=false;
 if(Q.type==='match')return askMatch(Q);
 if(Q.type==='order')return askOrder(Q);
 const c=Q.card;let prompt,main,opts,ans,sub='';
 if(Q.type==='en2es'){prompt='¿Qué significa?';main=`<div class="big">${esc(c.en)}</div>`;ans=c.es;opts=shuffle([ans,...distract('es',ans,c.u,3)])}
 if(Q.type==='es2en'){prompt='¿Cómo se dice en inglés?';main=`<div class="big">${esc(c.es)}</div>`;ans=c.en;opts=shuffle([ans,...distract('en',ans,c.u,3)])}
 if(Q.type==='listen'){prompt='Escucha y elige';main=`<button class="speak huge" id="sp" aria-label="Escuchar otra vez">${I.speaker}</button>`;ans=c.en;opts=shuffle([ans,...distract('en',ans,c.u,3)]);sub='<div class="sub">Toca el parlante para repetir · barra espaciadora</div>'}
 if(Q.type==='cloze'){prompt='Completa la frase';main=`<div class="cloze">${esc(c.q).replace('___','<u>&nbsp;?&nbsp;</u>')}</div>`;sub=`<div class="sub">${esc(c.es)}</div>`;ans=c.a;opts=shuffle(c.o)}
 R.ans=ans;
 $('#app').innerHTML=`<section class="play">${head()}
  <div class="card"><div class="label">${prompt}</div>${main}${sub}
   ${Q.type!=='listen'&&Q.type!=='es2en'&&canSpeak&&Q.type!=='cloze'?`<button class="speak" id="sp2">${I.speaker}</button>`:''}</div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-v="${esc(o)}"><span class="k">${k+1}</span><span>${esc(o)}</span></button>`).join('')}</div></section>`;
 bindHead();
 if(Q.type==='listen'){speak(c.en);$('#sp').onclick=()=>speak(c.en)}
 if(Q.type==='en2es')speak(c.en);
 if($('#sp2'))$('#sp2').onclick=()=>speak(c.en);
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(b));
 startTimer();
}
function bindHead(){$('#quit').onclick=()=>{stopTimer();home()}}
function startTimer(){stopTimer();if(!S.turbo)return;const bar=$('#tbar'),t0=Date.now();(function f(){const p=Math.max(0,1-(Date.now()-t0)/5000);if(bar)bar.style.transform=`scaleX(${p})`;if(p>0&&!R.locked)timerRAF=requestAnimationFrame(f)})()}
function stopTimer(){cancelAnimationFrame(timerRAF)}

function choose(b){if(R.locked)return;R.locked=true;stopTimer();
 const ok=b.dataset.v===R.ans;
 document.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===R.ans)x.classList.add('right')});
 if(!ok)b.classList.add('wrong');
 const Q=R.q[R.i];if(Q.type==='cloze'&&ok)speak(Q.card.q.replace('___',Q.card.a));
 resolve(ok,[Q.card.key],Q)}

function resolve(ok,keys,Q,partial){
 const ms=Date.now()-R.t0;
 keys.forEach(k=>setBox(k,ok));
 if(partial)partial();
 R.res[R.i]=ok;
 let gained=0;
 if(ok){R.combo++;R.best=Math.max(R.best,R.combo);gained=10*comboMult()+(S.turbo&&ms<5000?5:0);R.xp+=gained;addXP(gained);sfx.ok(R.combo);floatXP(gained)}
 else{R.combo=Math.max(0,R.combo-3);sfx.no();if(R.retries<3&&Q.type!=='match'){R.retries++;const t=Q.card.kind==='item'?pick(typesFor(Q.card).filter(x=>x!=='listen')):Q.type;R.q.push({type:t,card:Q.card,retry:true})}}
 const c=$('#combo');if(c){c.textContent='x'+comboMult();c.classList.toggle('hot',R.combo>=3);c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}
 document.querySelectorAll('.segs i').forEach((s,k)=>{s.className=R.res[k]===true?'ok':R.res[k]===false?'no':''});
 save();
 if(ok){const msgs=R.combo>=6?['¡Imparable!','¡En llamas!','¡Modo experto!']:R.combo>=3?['¡Combo!','¡Vas volando!','¡Sigue así!']:['¡Bien!','¡Eso!','Perfecto','Correcto','¡Excelente!'];
  showFb(true,pick(msgs),R.combo===3?'Combo activado: ahora ganas el doble.':R.combo===6?'Combo x3.':`+${gained} XP`);setTimeout(()=>{if(R&&R.res[R.i]===true&&!R.adv){next()}},850)}
 else showFb(false,'Casi.',Q.type==='match'?'Los pares con error volverán a aparecer más adelante.':`La respuesta es: <b>${esc(Q.type==='order'?Q.card.en:R.ans)}</b>. Vuelve al final de la ronda para que la fijes.${R.combo>=3?' Tu combo bajó un nivel, pero sigue vivo.':''}`)
}
function next(){if(!R)return;R.adv=true;closeFb();R.i++;R.adv=false;if(R.i%3===0&&R.i<R.q.length)milestone();ask()}
function floatXP(n){const c=document.querySelector('.card');if(!c)return;const f=document.createElement('div');f.className='float';f.textContent='+'+n;c.appendChild(f);setTimeout(()=>f.remove(),900)}
function addXP(n){const before=levelInfo(S.xp).l;S.xp+=n;const L=levelInfo(S.xp);renderTop();if(L.l>before)levelUp(L.l)}
function levelUp(l){sfx.level();const d=document.createElement('div');d.className='lvup';d.innerHTML=`<div><span class="label">Subiste de nivel</span><b>${l}</b></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1300)}

/* Ordenar palabras */
function askOrder(Q){const c=Q.card,words=c.en.split(' ');let extra=[];
 const others=(c.u.sent||[]).map(s=>s[0]).filter(s=>s!==c.en).join(' ').split(' ').filter(w=>w&&!words.map(norm).includes(norm(w)));
 if(others.length)extra=[pick(others)];
 const chips=shuffle(words.concat(extra).map((w,i)=>({w,id:i})));let line=[];
 R.ans=c.en;
 $('#app').innerHTML=`<section class="play">${head()}
  <div class="card"><div class="label">Arma la frase en inglés</div><div class="big" style="font-size:clamp(22px,6vw,30px)">${esc(c.es)}</div>
   <div class="line" id="line" aria-label="Tu respuesta"></div></div>
  <div class="chips" id="chips">${chips.map(x=>`<button class="chip" data-id="${x.id}">${esc(x.w)}</button>`).join('')}</div>
  <button class="btn full check" id="chk" disabled>Comprobar</button></section>`;
 bindHead();startTimer();
 const drawLine=()=>{$('#line').innerHTML=line.map(x=>`<button class="chip" data-id="${x.id}">${esc(x.w)}</button>`).join('');
  $('#line').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(R.locked)return;sfx.tap();line=line.filter(x=>x.id!=b.dataset.id);document.querySelector(`#chips [data-id="${b.dataset.id}"]`).classList.remove('used');drawLine()});
  $('#chk').disabled=!line.length};
 $('#chips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{if(R.locked||b.classList.contains('used'))return;sfx.tap();b.classList.add('used');line.push(chips.find(x=>x.id==b.dataset.id));drawLine()});
 $('#chk').onclick=()=>{if(R.locked)return;R.locked=true;stopTimer();$('#chk').disabled=true;const ok=norm(line.map(x=>x.w).join(' '))===norm(c.en);if(ok)speak(c.en);resolve(ok,[c.key],Q)};
}

/* Emparejar */
function askMatch(Q){const cs=Q.cards,L=shuffle(cs),Rr=shuffle(cs);let sel=null,left=4,miss=0;const bad=new Set();
 $('#app').innerHTML=`<section class="play">${head()}
  <div class="card"><div class="label">Empareja rápido</div><div class="sub">Toca una palabra y luego su pareja</div></div>
  <div class="match"><div class="col">${L.map(c=>`<button class="mt" data-k="${c.key}" data-s="en">${esc(c.en)}</button>`).join('')}</div>
  <div class="col">${Rr.map(c=>`<button class="mt" data-k="${c.key}" data-s="es">${esc(c.es)}</button>`).join('')}</div></div></section>`;
 bindHead();startTimer();
 document.querySelectorAll('.mt').forEach(b=>b.onclick=()=>{if(R.locked)return;
  if(b.dataset.s==='en'){const c=cs.find(x=>x.key===b.dataset.k);if(c)speak(c.en)}
  if(!sel||sel.dataset.s===b.dataset.s){document.querySelectorAll('.mt.sel').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');sfx.tap();return}
  if(sel.dataset.k===b.dataset.k){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('gone')});tone(660+(4-left)*120,.09,'triangle');left--;sel=null;
   if(!left){R.locked=true;stopTimer();const ok=miss<=1;
    resolve(ok,[],Q,()=>cs.forEach(c=>setBox(c.key,!bad.has(c.key))))}}
  else{bad.add(sel.dataset.k);bad.add(b.dataset.k);miss++;[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),300)});tone(240,.12,'sine',0,.1);sel=null}
 })}

/* ---------- Retroalimentación ---------- */
function showFb(ok,title,body){const fb=$('#fb');fb.className='fb show '+(ok?'ok':'no');$('#fbmsg').innerHTML=`<strong>${title}</strong><span>${body}</span>`;const b=$('#fbbtn');b.textContent='Continuar';b.onclick=next;if(!ok)setTimeout(()=>b.focus(),50)}
function closeFb(){$('#fb').className='fb'}

/* ---------- Fin de ronda ---------- */
function finish(){closeFb();stopTimer();
 const firstTry=R.q.map((q,k)=>({q,r:R.res[k]})).filter(x=>!x.q.retry);
 const acc=firstTry.filter(x=>x.r).length/firstTry.length;
 const stars=acc>=.9?3:acc>=.7?2:1;
 S.today++;sessionRounds++;
 if(S.last!==TODAY){S.streak=S.last===YEST?S.streak+1:1;S.last=TODAY}
 const nx=nextOf(R.u);const wasLocked=!!nx&&!unlocked(nx);
 const lucky=Math.random()<.6;
 const reviewed=new Set(R.q.filter(q=>q.card).map(q=>q.card.key).concat(R.q.filter(q=>q.cards).flatMap(q=>q.cards.map(c=>c.key)))).size;
 const moreDue=dueCards().length;
 save();renderTop();
 const nowUnlocked=wasLocked&&unlocked(nx);
 const breakDue=sessionRounds%3===0;
 const u=R.u;
 $('#app').innerHTML=`<section class="center">
  <div class="label">${esc(u.name)} · Ronda terminada</div>
  <h2 style="font-size:32px">${stars===3?'¡Ronda perfecta!':stars===2?'¡Muy buena ronda!':'Ronda completa. Cada ronda suma.'}</h2>
  <div class="stars">${[0,1,2].map(k=>I.star(k<stars).replace('class="on"',`class="on" style="animation-delay:${k*.15}s"`)).join('')}</div>
  <div class="stats"><div class="stat"><b class="num">${Math.round(acc*100)}%</b><span>al primer intento</span></div><div class="stat"><b class="num" id="xpc">+0</b><span>XP ganados</span></div><div class="stat"><b class="num">${R.best}</b><span>mejor combo</span></div></div>
  ${lucky?`<button class="chest" id="chest">${I.chest}Apareció un cofre sorpresa. Tócalo.</button>`:''}
  ${nowUnlocked?`<div class="rule"><b>${worldOf(nx).units[0]===nx.id?'Nuevo mundo desbloqueado':'Nueva unidad desbloqueada'}:</b> ${esc(nx.name)}</div>`:''}
  <div class="rule" style="background:var(--surface);border-color:var(--line)">${u.review?`Repasaste <b class="num">${reviewed}</b> elementos. Lo que acertaste vuelve en unos días; lo que fallaste, en el próximo repaso.`:`Dominio de <b>${esc(u.name)}</b>: <span class="num">${Math.round(mastery(u)*100)}%</span>`}${S.today===GOAL?' · <b>¡Meta diaria cumplida!</b>':''}</div>
  <button class="btn full" id="again">${breakDue?'Pausa activa de 20 s y seguir':u.review?(moreDue?'Seguir repasando':'Seguir aprendiendo'):'Otra ronda'}</button>
  <div class="row">${nowUnlocked?`<button class="btn ghost" id="nextU">Ir a ${esc(nx.name)}</button>`:''}<button class="btn ghost" id="home">Inicio</button></div>
 </section>`;
 let n=0;const tgt=R.xp,ci=setInterval(()=>{n=Math.min(tgt,n+Math.ceil(tgt/20)||1);$('#xpc')&&($('#xpc').textContent='+'+n);if(n>=tgt)clearInterval(ci)},30);
 if(lucky)$('#chest').onclick=function(){if(this.dataset.o)return;this.dataset.o=1;const b=pick([10,15,20,25,30]);sfx.chest();this.classList.add('open');this.innerHTML=I.chest+`<span class="num">+${b} XP</span> de regalo`;addXP(b);save()};
 const go=u.review?(moreDue?startReview:quickStart):()=>startRound(u);
 $('#again').onclick=()=>{sfx.tap();breakDue?brainBreak(go):go()};
 $('#home').onclick=home;
 if(nowUnlocked)$('#nextU').onclick=()=>{const v=nx;S.learned[v.id]?startRound(v):learn(v)};
 R=null;
}

/* ---------- Pausa activa ---------- */
function brainBreak(then){const acts=['Ponte de pie y estira los brazos hacia arriba','Mira algo lejano por la ventana','Toma un vaso de agua','Gira los hombros hacia atrás 5 veces','Respira: 4 s adentro, 4 s afuera'];
 const r=70,c=2*Math.PI*r;let left=20;
 $('#app').innerHTML=`<section class="center"><div class="label">Pausa activa</div><h2 style="font-size:28px">${pick(acts)}</h2>
  <svg class="brk" viewBox="0 0 180 180"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--chip)" stroke-width="12"/><circle id="bc" cx="90" cy="90" r="${r}" fill="none" stroke="var(--teal)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="0" transform="rotate(-90 90 90)" style="transition:stroke-dashoffset 1s linear"/><text id="bt" x="90" y="104" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="44" fill="var(--ink)">20</text></svg>
  <p class="sub">Moverte un poco ayuda a volver con la cabeza fresca.</p>
  <button class="btn ghost full" id="skip">Saltar pausa</button></section>`;
 const iv=setInterval(()=>{left--;const bt=$('#bt'),bc=$('#bc');if(!bt){clearInterval(iv);return}bt.textContent=left;bc.style.strokeDashoffset=c*(1-left/20);if(left<=0){clearInterval(iv);sfx.level();then()}},1000);
 $('#skip').onclick=()=>{clearInterval(iv);then()};
}

/* ---------- Teclado ---------- */
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
 if($('#fb').classList.contains('show')&&(e.key==='Enter')){e.preventDefault();next();return}
 if(R&&!R.locked&&/^[1-4]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)b.click()}
 if(R&&e.key===' '&&R.q[R.i]&&R.q[R.i].type==='listen'){e.preventDefault();speak(R.q[R.i].card.en)}
});
if(canSpeak)try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
/* Con un solo jugador entra directo; con varios, pregunta quién juega */
if(P.list.length===1)enter(P.list[0].id);else profiles();
</script>

</body></html>
