<!doctype html>
<html lang="es">
<head>
<script src="../perfil.js" data-modulo="finanzas"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Foco Finanzas</title>
<meta name="theme-color" content="#16213A">
<link rel="manifest" href="../manifest.json">
<link rel="icon" type="image/png" href="../iconos/favicon.png">
<link rel="apple-touch-icon" href="../iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Foco Finanzas · una pregunta por pantalla: ¿cuánto me queda? Poco texto, sin decoración. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#EEF1EE; --ink:#172024; --muted:#56636A; --faint:#A7B0B4;
  --line:#E2E5E1; --line-2:#DCE0DB;
  --gasto:#C24E16; --on-gasto:#FFFFFF; --gasto-ink:#A23F10; --gasto-soft:#FBE7DC; --gasto-light:#E39A75;
  --ingreso:#23784A; --ingreso-soft:#DCEFE3;
  --ahorro:#2B6A99; --on-ahorro:#FFFFFF; --ahorro-soft:#DCE8F2; --ahorro-track:#E3ECF3;
  --queda:#DCE7DF;
  --f-num:"Bricolage Grotesque", system-ui, sans-serif;
  --f-ui:"Lexend", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111716; --surface:#1A2120; --surface-2:#232B2A; --ink:#E8EDEC; --muted:#9DAAA8; --faint:#66716F;
  --line:#2A3332; --line-2:#34403E;
  --gasto:#E8794A; --on-gasto:#1B0B03; --gasto-ink:#F2A47F; --gasto-soft:#3A2418; --gasto-light:#8E4A2C;
  --ingreso:#5CC48A; --ingreso-soft:#173326;
  --ahorro:#7AB1DD; --on-ahorro:#08131C; --ahorro-soft:#1B2C3A; --ahorro-track:#22313D;
  --queda:#24332B; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#1A2120; --surface-2:#232B2A; --ink:#E8EDEC; --muted:#9DAAA8; --faint:#66716F;
  --line:#2A3332; --line-2:#34403E;
  --gasto:#E8794A; --on-gasto:#1B0B03; --gasto-ink:#F2A47F; --gasto-soft:#3A2418; --gasto-light:#8E4A2C;
  --ingreso:#5CC48A; --ingreso-soft:#173326;
  --ahorro:#7AB1DD; --on-ahorro:#08131C; --ahorro-soft:#1B2C3A; --ahorro-track:#22313D;
  --queda:#24332B; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.4;padding:0 16px calc(90px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:6px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ahorro);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2{margin:0}

/* Encabezado */
.hd{display:flex;align-items:center;gap:8px;min-height:44px}
.hd h1{flex:1;font-family:var(--f-num);font-weight:800;font-size:24px;letter-spacing:-.01em}
.circ{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.circ.plain{border-color:transparent;background:transparent;color:var(--muted)}
.circ svg{width:20px;height:20px}
.msel{position:relative;display:inline-flex;align-items:center}
.msel select{appearance:none;-webkit-appearance:none;height:38px;padding:0 36px 0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:15px;color:var(--ink)}
.msel svg{position:absolute;right:13px;width:16px;height:16px;pointer-events:none}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.tight{padding:12px 14px}
.lbl{font-size:14px;color:var(--muted)}
.big{font-family:var(--f-num);font-weight:800;font-size:42px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big.neg{color:var(--gasto-ink)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--queda);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.note{font-size:14px;color:var(--muted);margin:0}
.warn{font-size:14px;color:var(--gasto-ink);font-weight:600;margin:0}
.sec-hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.sec-hd b{font-size:16px}
.link{border:0;background:none;color:var(--ahorro);font-weight:700;font-size:14px;padding:6px 0}

/* Botones */
.btn{min-height:52px;border:0;border-radius:14px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px}
.btn svg{width:18px;height:18px}
.btn.gasto{background:var(--gasto);color:var(--on-gasto)}
.btn.ahorro{background:var(--ahorro);color:var(--on-ahorro)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.btn.full{width:100%}
.btn.sm{min-height:44px;font-size:15px}
.btn.danger{background:var(--gasto-soft);color:var(--gasto-ink)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}

/* Gastos fijos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.paid{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:14px}
.paid svg{width:14px;height:14px}
.pay{padding:7px 12px;border-radius:99px;border:1.5px solid var(--gasto);background:var(--surface);color:var(--gasto-ink);font-weight:700;font-size:14px}
.hint{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:16px;border:1.5px dashed var(--line-2);background:transparent;color:var(--muted);font-size:14px}
.hint b{color:var(--ink)}
.hint svg{width:22px;height:22px;flex:none;color:var(--muted)}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:2px 14px}
.it{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--surface-2);background:transparent;text-align:left;color:var(--ink)}
.it:last-child{border-bottom:0}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.ic svg{width:18px;height:18px}
.ic.gasto{background:var(--gasto-soft);color:var(--gasto-ink)}
.ic.ingreso{background:var(--ingreso-soft);color:var(--ingreso)}
.ic.ahorro{background:var(--ahorro-soft);color:var(--ahorro)}
.it .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.it .t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .t small{font-size:13px;color:var(--muted)}
.it .t small.over{color:var(--gasto-ink);font-weight:700}
.it .v{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.it .v.ingreso{color:var(--ingreso)}
.it .v.ahorro{color:var(--ahorro)}
.mini{display:block;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;background:var(--gasto)}
.mini i.soft{background:var(--gasto-light)}
.day-h{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding:4px 2px 0}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{padding:7px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:700;font-size:14px}
.filters button[aria-checked="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:14px 6px;margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px}

/* Ahorro */
.bk{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;color:var(--ink)}
.bk .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bk .top b{font-size:16px}
.track{display:block;height:8px;border-radius:99px;background:var(--ahorro-track);overflow:hidden}
.track i{display:block;height:100%;background:var(--ahorro)}
.track i.ok{background:var(--ingreso)}

/* Formularios */
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.in{width:100%;min-width:0;height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--surface);font-size:16px;color:var(--ink)}
.in:focus{outline:none;border-color:var(--ahorro)}
.fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.cfg{display:grid;grid-template-columns:34px minmax(0,1fr) 120px 36px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--surface-2)}
.cfg:last-child{border-bottom:0}
.cfg .in{height:40px;font-size:15px;text-align:right}
.x{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x svg{width:16px;height:16px}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in2{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:66px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] svg{stroke-width:2.3}

/* Hoja para anotar */
.sheet{position:fixed;inset:0;z-index:30;background:var(--surface);overflow-y:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .inner{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px}
.seg{flex:1;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{padding:8px 0;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.seg button[aria-checked="true"].gasto{background:var(--gasto);color:var(--on-gasto)}
.seg button[aria-checked="true"].ingreso{background:var(--ingreso);color:#fff}
.seg button[aria-checked="true"].ahorro{background:var(--ahorro);color:var(--on-ahorro)}
.amt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.amt .num{font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em}
.amt .num.zero{color:var(--faint)}
.amt small{font-size:14px;color:var(--muted);text-align:center}
.cats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.cats button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:11px;color:var(--ink);min-width:0}
.cats button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cats button svg{width:22px;height:22px;color:var(--gasto-ink)}
.cats button[aria-pressed="true"]{border:2px solid var(--gasto);background:var(--gasto-soft);font-weight:700}
.opt{padding:9px 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:14px}
.opt[aria-pressed="true"]{border:2px solid var(--ahorro);background:var(--ahorro-soft)}
.opt.ing[aria-pressed="true"]{border-color:var(--ingreso);background:var(--ingreso-soft)}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.pad button{height:52px;border:0;border-radius:12px;background:var(--surface-2);font-family:var(--f-num);font-weight:700;font-size:24px;color:var(--ink)}
.pad button.sm{font-size:19px}
.pad button svg{width:24px;height:24px}
.err{color:var(--gasto-ink);font-weight:700;font-size:14px;margin:0;text-align:center}
.ask{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;background:var(--surface-2);border:1.5px solid var(--line-2)}
.ask p{margin:0;font-size:15px}
.date{height:44px;padding:0 10px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:15px;color:var(--ink);font-weight:600;max-width:150px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (max-width:360px){.big{font-size:36px}.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" aria-label="Secciones"><div class="in2" id="navin"></div></nav>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Anotar" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ============ utilidades ============ */
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => ymd(new Date());
const monthOf = d => String(d || '').slice(0, 7);
function addMonths(m, k) { let [y, mo] = m.split('-').map(Number); mo += k; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return y + '-' + pad(mo); }
function monthsBetween(a, b) { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); }
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const mName = m => MESES[Number(m.slice(5)) - 1];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = m => cap(mName(m)) + (m.slice(0, 4) !== todayStr().slice(0, 4) ? ' ' + m.slice(0, 4) : '');
const fmt = n => (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('es-CL');
const fmtIn = n => n ? Math.round(n).toLocaleString('es-CL') : '';
const parseAmt = s => Number(String(s || '').replace(/\D/g, '')) || 0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
function dayLabel(d) {
  if (d === todayStr()) return 'Hoy';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (d === ymd(y)) return 'Ayer';
  const dt = new Date(d + 'T12:00:00');
  return ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][dt.getDay()] + ' ' + dt.getDate() + ' de ' + MESES[dt.getMonth()];
}

/* ============ íconos ============ */
const sv = (p, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const CAT_IC = {
  casa: sv('<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/>'),
  super: sv('<path d="M3 4h2l2 11h11l2-8H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>'),
  comida: sv('<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 2-2 6 0 8v10"/>'),
  transporte: sv('<rect x="5" y="4" width="14" height="13" rx="2"/><path d="M5 11h14M8 20v-3M16 20v-3"/>'),
  cuentas: sv('<path d="M13 3L5 13h6l-1 8 8-10h-6z"/>'),
  salud: sv('<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>'),
  ocio: sv('<path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"/>'),
  compras: sv('<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 0 1 6 0v2"/>'),
  deudas: sv('<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/>'),
  otros: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18" cy="12" r="1.8"/></svg>',
  _: sv('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8" r="1.3"/>'),
};
const IC = {
  inicio: sv('<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-5h-6v5H5a1 1 0 0 1-1-1z"/>', 1.8),
  movs: sv('<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>', 1.8),
  ahorro: sv('<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5A8.5 8.5 0 0 1 20.5 12"/><circle cx="12" cy="12" r="3.5"/>', 1.8),
  ajustes: sv('<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'),
  back: sv('<path d="M15 5l-7 7 7 7"/>', 2.6),
  close: sv('<path d="M6 6l12 12M18 6L6 18"/>', 2.4),
  minus: sv('<path d="M5 12h14"/>', 2.6),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.6),
  save: sv('<circle cx="12" cy="12" r="8"/><path d="M12 8v8M8.5 12h7"/>', 2.2),
  out: sv('<path d="M14 5l7 7-7 7M21 12H9"/>', 2.2),
  check: sv('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3),
  chev: sv('<path d="M6 9l6 6 6-6"/>', 2.6),
  del: sv('<path d="M9 6h11v12H9l-5-6z"/><path d="M13 10l4 4M17 10l-4 4"/>', 2),
};
const catIcon = id => CAT_IC[id] || CAT_IC._;

/* ============ datos (misma forma que siempre: no se pierde nada) ============ */
const DEFAULT_CATS = [
  { id: 'casa', name: 'Arriendo y casa', c: 0 }, { id: 'super', name: 'Supermercado', c: 1 },
  { id: 'comida', name: 'Comida fuera', c: 2 }, { id: 'transporte', name: 'Transporte', c: 3 },
  { id: 'cuentas', name: 'Cuentas básicas', c: 7 }, { id: 'salud', name: 'Salud', c: 5 },
  { id: 'ocio', name: 'Ocio', c: 4 }, { id: 'compras', name: 'Compras', c: 6 },
  { id: 'deudas', name: 'Deudas y créditos', c: 8 }, { id: 'otros', name: 'Otros', c: 9 },
];
const DEFAULT_BUCKETS = [
  { id: 'general', name: 'General', goal: 0, deadline: '' },
  { id: 'emergencias', name: 'Emergencias', goal: 0, deadline: '' },
  { id: 'vacaciones', name: 'Vacaciones', goal: 0, deadline: '' },
];
const SHORT = { casa: 'Casa', super: 'Súper', comida: 'Comida', transporte: 'Transporte', cuentas: 'Cuentas', salud: 'Salud', ocio: 'Ocio', compras: 'Compras', deudas: 'Deudas', otros: 'Otros' };
const LKEY = 'foco-plata-v1';
const S = {
  view: 'inicio', month: monthOf(todayStr()), filter: 'todo',
  movs: [], st: { sueldo: 0, cats: DEFAULT_CATS, buckets: DEFAULT_BUCKETS, rolled: {}, fijos: [] }, raw: {},
  sheet: null, editBucket: null, askFijos: null,
};
try { const v = localStorage.getItem('foco-finanzas-view'); if (['inicio', 'movs', 'ahorro'].includes(v)) S.view = v; } catch (e) {}

function localAll() { try { return JSON.parse(localStorage.getItem(LKEY) || '{}'); } catch (e) { return {}; } }
function localPut(all) { localStorage.setItem(LKEY, JSON.stringify(all)); }
function load() {
  const all = localAll(), movs = []; let st = {};
  for (const id in all) { const d = all[id]; if (!d) continue; if (d.kind === 'mov') movs.push({ id, ...d }); else if (d.kind === 'settings') st = d; }
  movs.sort((a, b) => (a.date === b.date ? (b.createdAt || 0) - (a.createdAt || 0) : a.date < b.date ? 1 : -1));
  S.movs = movs; S.raw = st;
  S.st = {
    sueldo: Number(st.sueldo) || 0,
    cats: Array.isArray(st.cats) && st.cats.length ? st.cats : DEFAULT_CATS,
    buckets: Array.isArray(st.buckets) && st.buckets.length ? st.buckets : DEFAULT_BUCKETS,
    rolled: st.rolled && typeof st.rolled === 'object' ? st.rolled : {},
    fijos: Array.isArray(st.fijos) ? st.fijos : [],
  };
}
function write(fn, okMsg) {
  try { const all = localAll(); fn(all); localPut(all); load(); render(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast('No se pudo guardar. Revisa el espacio del teléfono.'); return false; }
}
const putDoc = (id, doc, msg) => write(all => { all[id] = doc; }, msg);
const delDoc = (id, msg) => write(all => { delete all[id]; }, msg);
function saveSettings(patch, msg) {
  const next = { ...S.raw, ...S.st, ...patch, kind: 'settings' };
  return putDoc('settings', next, msg);
}

/* ============ cálculos ============ */
const catById = id => S.st.cats.find(c => c.id === id);
const catLabel = (id, fb) => (catById(id) || {}).name || fb || 'Otros';
const bucketById = id => S.st.buckets.find(b => b.id === id);
const bucketName = id => (bucketById(id) || {}).name || 'Bolsillo borrado';
function totals(month) {
  const t = { ing: 0, gas: 0, apo: 0, ret: 0, byCat: {}, catNames: {}, n: 0 };
  for (const m of S.movs) {
    if (monthOf(m.date) !== month) continue;
    t.n++;
    const a = Number(m.amount) || 0;
    if (m.type === 'ingreso') t.ing += a;
    else if (m.type === 'gasto') { t.gas += a; t.byCat[m.cat] = (t.byCat[m.cat] || 0) + a; t.catNames[m.cat] = m.catName; }
    else if (m.type === 'ahorro') t.apo += a;
    else if (m.type === 'retiro') t.ret += a;
  }
  t.neto = t.apo - t.ret;
  t.libre = t.ing - t.gas - t.apo + t.ret;
  return t;
}
function balances() {
  const b = {};
  for (const m of S.movs) {
    if (m.type === 'ahorro') for (const s of m.splits || []) b[s.b] = (b[s.b] || 0) + (Number(s.a) || 0);
    else if (m.type === 'retiro') b[m.bucket] = (b[m.bucket] || 0) - (Number(m.amount) || 0);
  }
  return b;
}
function perMonthNeeded(b, bal) {
  if (!b.goal || !b.deadline) return null;
  const left = b.goal - bal; if (left <= 0) return 0;
  return left / Math.max(1, monthsBetween(monthOf(todayStr()), b.deadline) + 1);
}
const fijoAmount = (f, month) => (f.overrides && f.overrides[month] != null) ? Number(f.overrides[month]) : (Number(f.amount) || 0);
const fijoPaid = (f, month) => S.movs.some(m => m.type === 'gasto' && m.fijo === f.id && monthOf(m.date) === month);
function monthOptions() {
  const cur = monthOf(todayStr()); let min = addMonths(cur, -5);
  for (const m of S.movs) { const k = monthOf(m.date); if (k && k < min) min = k; }
  const out = []; for (let k = cur; k >= min; k = addMonths(k, -1)) out.push(k);
  if (!out.includes(S.month)) out.push(S.month);
  return out;
}

/* ============ piezas ============ */
const monthSelect = () => `<label class="msel"><span class="sr">Mes</span><select id="msel">${monthOptions().map(m => `<option value="${m}" ${m === S.month ? 'selected' : ''}>${monthLabel(m)}</option>`).join('')}</select>${IC.chev}</label>`;
function header(title, opts = {}) {
  return `<header class="hd">${opts.back ? `<button class="circ" data-act="nav" data-v="inicio" aria-label="Volver">${IC.back}</button>` : ''}<h1>${title}</h1>${opts.month ? monthSelect() : ''}${opts.gear ? `<button class="circ plain" data-act="nav" data-v="ajustes" aria-label="Ajustes">${IC.ajustes}</button>` : ''}</header>`;
}
function movRow(m) {
  let ic, cls, title, sub = m.note || '', sign = '', vcls = '';
  if (m.type === 'gasto') { ic = catIcon(m.cat); cls = 'gasto'; title = catLabel(m.cat, m.catName); sign = '−'; if (m.fijo && !sub) sub = 'Gasto fijo'; }
  else if (m.type === 'ingreso') { ic = IC.plus; cls = 'ingreso'; title = m.note || 'Ingreso'; sub = ''; sign = '+'; vcls = 'ingreso'; }
  else if (m.type === 'ahorro') { ic = IC.save; cls = 'ahorro'; title = 'Ahorro · ' + (m.splits || []).map(s => bucketName(s.b)).join(', '); vcls = 'ahorro'; }
  else { ic = IC.out; cls = 'ahorro'; title = 'Sacaste de ' + bucketName(m.bucket); }
  return `<button class="it" data-act="mov" data-v="${esc(m.id)}"><span class="ic ${cls}">${ic}</span>
    <span class="t"><span>${esc(title)}</span>${sub ? `<small>${esc(sub)}</small>` : ''}</span>
    <span class="v ${vcls}">${sign}${fmt(m.amount)}</span></button>`;
}

/* ============ Inicio ============ */
function viewInicio() {
  const t = totals(S.month), cur = monthOf(todayStr()), isCur = S.month === cur;
  let h = header('Finanzas', { month: true, gear: true });

  // 1 · la pregunta principal
  h += `<section class="card" aria-label="Resumen del mes">`;
  if (t.ing > 0) {
    const g = Math.min(t.gas, t.ing), a = Math.max(0, Math.min(t.neto, t.ing - g));
    h += `<span class="lbl">${isCur ? 'Te quedan este mes' : 'Te quedó en ' + mName(S.month)}</span>
      <span class="big ${t.libre < 0 ? 'neg' : ''}">${fmt(t.libre)}</span>
      <span class="lbl">de ${fmt(t.ing)} que entraron</span>
      <div class="bar" role="img" aria-label="${pct(g, t.ing)}% gastado, ${pct(a, t.ing)}% ahorrado">${g ? `<i style="width:${g / t.ing * 100}%;background:var(--gasto)"></i>` : ''}${a ? `<i style="width:${a / t.ing * 100}%;background:var(--ahorro)"></i>` : ''}</div>
      <div class="legend"><span><i class="dot" style="background:var(--gasto)"></i>Gastaste <b class="num">${fmt(t.gas)}</b></span><span><i class="dot" style="background:var(--ahorro)"></i>Ahorraste <b class="num">${fmt(Math.max(0, t.neto))}</b></span></div>
      ${t.libre < 0 ? `<p class="warn">Salieron ${fmt(-t.libre)} más de lo que entró.</p>` : ''}`;
  } else {
    h += `<span class="lbl">Aún no anotas lo que te entró en ${mName(S.month)}.</span>`;
    if (isCur && S.st.sueldo > 0) h += `<div class="row2"><button class="btn ahorro" data-act="sueldo-reg">Sueldo · ${fmt(S.st.sueldo)}</button><button class="btn ghost" data-act="add" data-v="ingreso">Otro monto</button></div>`;
    else h += `<button class="btn ahorro full" data-act="add" data-v="ingreso">Anotar lo que me entró</button>`;
    if (t.gas) h += `<p class="note">Llevas ${fmt(t.gas)} en gastos este mes.</p>`;
  }
  h += `</section>`;

  // 2 · anotar en un toque
  h += `<div class="quick">
    <button class="btn gasto" data-act="add" data-v="gasto">${IC.minus}Gasto</button>
    <button class="btn ghost" data-act="add" data-v="ingreso"><span style="color:var(--ingreso);display:inline-flex">${IC.plus}</span>Ingreso</button>
    <button class="btn ghost" data-act="add" data-v="ahorro"><span style="color:var(--ahorro);display:inline-flex">${IC.save}</span>Ahorrar</button></div>`;

  // sobrante del mes anterior
  const pm = addMonths(cur, -1), pt = totals(pm);
  if (isCur && pt.ing > 0 && pt.libre >= 10000 && !S.st.rolled[pm]) {
    h += `<section class="card tight"><span style="font-size:15px">En ${mName(pm)} te sobraron <b class="num">${fmt(pt.libre)}</b>. ¿Los guardas?</span>
      <div class="row2"><button class="btn ahorro sm" data-act="roll" data-v="${pm}">Guardar</button><button class="btn ghost sm" data-act="roll-no" data-v="${pm}">Ahora no</button></div></section>`;
  }

  // 3 · gastos fijos
  if (S.st.fijos.length) {
    const paid = S.st.fijos.filter(f => fijoPaid(f, S.month));
    h += `<section class="card tight"><div class="sec-hd" style="padding:0"><b>Gastos fijos</b><span class="lbl" style="font-size:13px">${paid.length === S.st.fijos.length ? '¡Todos pagados!' : `${paid.length} de ${S.st.fijos.length} pagados`}</span></div><div class="chips">` +
      S.st.fijos.map(f => fijoPaid(f, S.month)
        ? `<span class="paid"><span style="color:var(--ingreso);display:inline-flex">${IC.check}</span>${esc(f.name)}</span>`
        : `<button class="pay" data-act="fijo-pay" data-v="${esc(f.id)}">${esc(f.name)} · ${fmt(fijoAmount(f, S.month))}</button>`).join('') + `</div></section>`;
  } else if (S.movs.length) {
    h += `<button class="hint" data-act="nav" data-v="ajustes">${IC.plus}<span><b>¿Pagos que se repiten?</b> Agrega arriendo, luz o internet y págalos con un toque.</span></button>`;
  }

  // 4 · en qué se fue
  const cats = Object.entries(t.byCat).sort((a, b) => b[1] - a[1]);
  if (cats.length) {
    const max = cats[0][1];
    h += `<div class="sec-hd"><b>En qué se fue</b><button class="link" data-act="see-gastos">Ver todo</button></div><div class="list">` +
      cats.slice(0, 4).map(([id, v]) => {
        const c = catById(id), lim = c ? Number(c.limit) || 0 : 0;
        let sub, w, soft = '';
        if (lim) { sub = v > lim ? `<small class="over">${fmt(v - lim)} sobre el límite</small>` : `<small>de ${fmt(lim)}</small>`; w = Math.min(100, v / lim * 100); }
        else { sub = ''; w = v / max * 100; soft = 'soft'; }
        return `<button class="it" data-act="see-cat" data-v="${esc(id)}"><span class="ic gasto">${catIcon(id)}</span>
          <span class="t"><span>${esc(catLabel(id, t.catNames[id]))}${sub ? ' ' : ''}</span>${sub}<span class="mini"><i class="${soft}" style="width:${w}%"></i></span></span>
          <span class="v">${fmt(v)}</span></button>`;
      }).join('') + `</div>`;
  }

  if (!S.movs.length) {
    h += `<section class="card"><b>Así funciona</b><ol class="steps"><li>Anota lo que te entró este mes.</li><li>Cada vez que gastes, tócalo en <b>Gasto</b>.</li><li>Lo que guardes, ponlo en un bolsillo de <b>Ahorro</b>.</li></ol></section>`;
  } else {
    h += `<button class="link" style="align-self:center" data-act="nav" data-v="tend">Comparar con meses anteriores</button>`;
  }
  return h;
}

/* ============ Movimientos ============ */
function viewMovs() {
  let h = header('Movimientos', { month: true });
  h += `<div class="filters" role="radiogroup" aria-label="Filtrar">` + [['todo', 'Todo'], ['gasto', 'Gastos'], ['ingreso', 'Ingresos'], ['ahorro', 'Ahorro']].map(([k, l]) =>
    `<button role="radio" aria-checked="${S.filter === k}" data-act="filter" data-v="${k}">${l}</button>`).join('') + `</div>`;
  const list = S.movs.filter(m => monthOf(m.date) === S.month && (S.filter === 'todo' || m.type === S.filter || (S.filter === 'ahorro' && m.type === 'retiro') || (S.filter.startsWith('cat:') && m.type === 'gasto' && m.cat === S.filter.slice(4))));
  if (S.filter.startsWith('cat:')) h += `<div class="sec-hd"><b>${esc(catLabel(S.filter.slice(4)))}</b><button class="link" data-act="filter" data-v="todo">Ver todo</button></div>`;
  if (!list.length) return h + `<p class="empty">No hay movimientos ${S.filter === 'todo' ? '' : 'de este tipo '}en ${mName(S.month)}.</p>`;
  if (S.filter === 'gasto' || S.filter.startsWith('cat:')) h += `<p class="note">${list.length} ${list.length === 1 ? 'gasto' : 'gastos'} · <b class="num">${fmt(list.reduce((a, m) => a + (Number(m.amount) || 0), 0))}</b></p>`;

}

/* ============ Ahorro ============ */
function viewAhorro() {
  const bal = balances(), total = Object.values(bal).reduce((a, b) => a + b, 0), tm = totals(monthOf(todayStr()));
  let h = header('Ahorro');
  h += `<section class="card"><span class="lbl">Tienes ahorrado</span><span class="big">${fmt(total)}</span>
    <span class="lbl">Este mes guardaste <b class="num" style="color:var(--ahorro)">${fmt(tm.apo)}</b>${tm.ret ? ` y sacaste <b class="num">${fmt(tm.ret)}</b>` : ''}</span>
    <div class="row2"><button class="btn ahorro" data-act="add" data-v="ahorro">Guardar</button><button class="btn ghost" data-act="add" data-v="retiro">Sacar</button></div></section>`;

    const v = bal[b.id] || 0, goal = Number(b.goal) || 0, need = perMonthNeeded(b, v);

    return `<button class="bk" data-act="bucket-edit" data-v="${esc(b.id)}"><span class="top"><b>${esc(b.name)}</b><span><b class="num">${fmt(v)}</b>${goal ? ` <span class="muted">de ${fmt(goal)}</span>` : ''}</span></span>

/* ============ Meses anteriores ============ */
function viewTend() {
  let h = header('Meses anteriores', { back: true });
  const cur = monthOf(todayStr()), rows = [];
  for (let i = 0; i < 6; i++) { const m = addMonths(cur, -i); rows.push({ m, ...totals(m) }); }
  const max = Math.max(1, ...rows.map(r => Math.max(r.ing, r.gas)));
  h += `<div class="list">` + rows.map(r => `<button class="it" style="grid-template-columns:minmax(0,1fr) auto" data-act="go-month" data-v="${r.m}">
      <span class="t"><span><b>${monthLabel(r.m)}</b></span>
      <small>Entró ${r.ing ? fmt(r.ing) : '—'} · Gastaste ${r.gas ? fmt(r.gas) : '—'} · Ahorraste ${r.neto > 0 ? fmt(r.neto) : '—'}</small>
      <span class="mini"><i style="width:${r.gas / max * 100}%"></i></span></span>
      <span class="v ${r.libre < 0 ? '' : 'ingreso'}">${r.ing ? fmt(r.libre) : ''}</span></button>`).join('') + `</div>
    <p class="note" style="text-align:center">A la derecha, lo que te quedó cada mes. Toca un mes para verlo.</p>`;
  return h;
}

/* ============ Hoja para anotar ============ */
const $sheet = document.getElementById('sheet');
function openSheet(type, mov, pre) {
  const bal = balances();
  if (mov) {
    S.sheet = { editId: mov.id, type: mov.type, amount: Number(mov.amount) || 0, date: mov.date, cat: mov.cat || null, note: mov.note || '', bucket: mov.bucket || (mov.splits && mov.splits[0] && mov.splits[0].b) || S.st.buckets[0].id,
      splits: mov.splits || null, multi: (mov.splits || []).length > 1, fijo: mov.fijo || null, createdAt: mov.createdAt, err: '', confirmDel: false };
  } else {
    const t = type || 'gasto', cur = monthOf(todayStr());
    S.sheet = { type: t, amount: t === 'ingreso' && S.st.sueldo ? S.st.sueldo : 0, date: S.month === cur ? todayStr() : S.month + '-01', cat: null, note: t === 'ingreso' ? 'Sueldo' : '',
      bucket: t === 'retiro' ? (S.st.buckets.find(b => (bal[b.id] || 0) > 0) || S.st.buckets[0]).id : S.st.buckets[0].id, fijo: null, err: '', confirmDel: false, ...(pre || {}) };
  }
  document.body.style.overflow = 'hidden';
  renderSheet();
}
function closeSheet() { S.sheet = null; $sheet.hidden = true; $sheet.innerHTML = ''; document.body.style.overflow = ''; }
function renderSheet() {
  const sh = S.sheet; if (!sh) return closeSheet();
  const bal = balances(), cat = sh.cat && catById(sh.cat);
  const TT = { gasto: 'Gasto', ingreso: 'Ingreso', ahorro: 'Ahorro' };
  let top = sh.type === 'retiro' || sh.editId
    ? `<b style="flex:1;font-family:var(--f-num);font-size:20px">${sh.editId ? 'Corregir' : 'Sacar de tus ahorros'}</b>`
    : `<div class="seg" role="radiogroup" aria-label="Tipo">${Object.entries(TT).map(([k, l]) => `<button role="radio" class="${k}" aria-checked="${sh.type === k}" data-act="sh-type" data-v="${k}">${l}</button>`).join('')}</div>`;
  let h = `<div class="inner"><div class="hd"><button class="circ" data-act="sh-close" aria-label="Cerrar">${IC.close}</button>${top}</div>`;
  const cap2 = sh.type === 'gasto' ? (cat ? cat.name : 'Elige una categoría') : sh.type === 'ingreso' ? (sh.note || 'Ingreso') : sh.type === 'ahorro' ? 'A ' + bucketName(sh.bucket) : 'De ' + bucketName(sh.bucket);
  h += `<div class="amt"><span class="num ${sh.amount ? '' : 'zero'}" aria-live="polite">${fmt(sh.amount)}</span><small>${esc(cap2)}${sh.date ? ' · ' + esc(dayLabel(sh.date).toLowerCase()) : ''}</small></div>`;
  if (sh.type === 'gasto') h += `<div class="cats" role="group" aria-label="Categoría">${S.st.cats.map(c => `<button aria-pressed="${sh.cat === c.id}" data-act="sh-cat" data-v="${esc(c.id)}">${catIcon(c.id)}<span>${esc(SHORT[c.id] || c.name)}</span></button>`).join('')}</div>`;
  if (sh.type === 'ingreso') h += `<div class="chips">${['Sueldo', 'Bono', 'Otro'].map(n => `<button class="opt ing" aria-pressed="${sh.note === n}" data-act="sh-note" data-v="${n}">${n}</button>`).join('')}</div>`;
  if (sh.type === 'ahorro') h += sh.multi ? `<p class="note">Este ahorro se repartió en varios bolsillos: ${(sh.splits || []).map(s => esc(bucketName(s.b)) + ' ' + fmt(s.a)).join(', ')}. Solo puedes cambiar la fecha o la nota, o borrarlo.</p>`
    : `<div class="chips">${S.st.buckets.map(b => `<button class="opt" aria-pressed="${sh.bucket === b.id}" data-act="sh-bucket" data-v="${esc(b.id)}">${esc(b.name)}</button>`).join('')}</div>`;
  if (sh.type === 'retiro') h += `<div class="chips">${S.st.buckets.map(b => `<button class="opt" aria-pressed="${sh.bucket === b.id}" data-act="sh-bucket" data-v="${esc(b.id)}">${esc(b.name)} · ${fmt(bal[b.id] || 0)}</button>`).join('')}</div>`;
  h += `<div style="display:flex;gap:8px"><label style="flex:1;min-width:0"><span class="sr">Nota</span><input class="in" type="text" id="sh-note" value="${esc(sh.note)}" placeholder="${sh.type === 'ingreso' ? 'Concepto' : 'Nota (opcional)'}" maxlength="60"></label>
    <label><span class="sr">Fecha</span><input class="date" type="date" id="sh-date" value="${sh.date}" max="${todayStr()}"></label></div>`;
  if (!sh.multi) h += `<div class="pad" role="group" aria-label="Teclado">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(k => `<button data-act="key" data-v="${k}">${k}</button>`).join('')}<button class="sm" data-act="key" data-v="000">000</button><button data-act="key" data-v="0">0</button><button data-act="key" data-v="del" aria-label="Borrar">${IC.del}</button></div>`;
  h += `<p class="err" id="sh-err" ${sh.err ? '' : 'hidden'}>${esc(sh.err)}</p>`;
  if (sh.ask) {
    const fj = S.st.fijos.find(f => f.id === sh.fijo), mm = monthOf(sh.date);
    h += `<div class="ask" role="alertdialog" aria-label="¿Para qué meses?"><p>Pagaste <b>${fmt(sh.amount)}</b> por ${esc(fj ? fj.name : 'este gasto')}, en vez de ${fmt(fj ? fijoAmount(fj, mm) : 0)}. ¿Este cambio es…</p>
      <button class="btn ghost full" data-act="sh-scope" data-v="month">Solo ${mName(mm)}</button>
      <button class="btn gasto full" data-act="sh-scope" data-v="forward">Desde ${mName(mm)} en adelante</button>
      <button class="link" style="align-self:center" data-act="sh-noscope">Volver</button></div>`;
    $sheet.innerHTML = h + `</div>`; $sheet.hidden = false;
    setTimeout(() => { const a = $sheet.querySelector('.ask'); if (a) a.scrollIntoView({ block: 'end' }); }, 20);
    return;
  }
  const lbl = sh.editId ? 'Guardar cambios' : { gasto: 'Guardar gasto', ingreso: 'Guardar ingreso', ahorro: 'Guardar ahorro', retiro: 'Sacar' }[sh.type];
  h += `<button class="btn full ${sh.type === 'gasto' ? 'gasto' : 'ahorro'}" style="${sh.type === 'ingreso' ? 'background:var(--ingreso);color:#fff' : ''}${sh.multi ? ';margin-top:auto' : ''}" data-act="sh-save">${lbl}</button>`;
  if (sh.editId) h += sh.confirmDel ? `<div class="row2"><button class="btn danger" data-act="sh-del">Sí, borrar</button><button class="btn ghost" data-act="sh-nodel">No</button></div>` : `<button class="link" style="align-self:center;color:var(--gasto-ink)" data-act="sh-del">Borrar movimiento</button>`;
  $sheet.innerHTML = h + `</div>`;
  $sheet.hidden = false;
}
function sheetFail(msg) { S.sheet.err = msg; const e = document.getElementById('sh-err'); if (e) { e.textContent = msg; e.hidden = false; } if (navigator.vibrate) navigator.vibrate(60); }
function saveSheet(scope) {
  const sh = S.sheet, bal = balances();
  if (!sh.amount) return sheetFail('Escribe un monto.');
  if (!sh.date) return sheetFail('Elige una fecha.');
  if (sh.date > todayStr()) return sheetFail('La fecha no puede ser futura.');
  const old = sh.editId ? S.movs.find(m => m.id === sh.editId) : null;
  const doc = { ...(old || {}), kind: 'mov', type: sh.type, amount: sh.amount, date: sh.date, note: (sh.note || '').trim(), createdAt: sh.createdAt || Date.now() };
  delete doc.id; delete doc.cat; delete doc.catName; delete doc.splits; delete doc.bucket;
  if (sh.fijo) doc.fijo = sh.fijo; else delete doc.fijo;
  if (sh.type === 'gasto') { if (!sh.cat) return sheetFail('Elige una categoría.'); doc.cat = sh.cat; doc.catName = (catById(sh.cat) || {}).name || (old && old.catName) || ''; }
  if (sh.type === 'ahorro') doc.splits = sh.multi ? sh.splits : [{ b: sh.bucket, a: sh.amount }];
  if (sh.type === 'retiro') {
    let have = bal[sh.bucket] || 0;
    if (old && old.type === 'retiro' && old.bucket === sh.bucket) have += Number(old.amount) || 0;
    if (sh.amount > have) return sheetFail(`En ${bucketName(sh.bucket)} tienes ${fmt(have)}.`);
    doc.bucket = sh.bucket;
  }
  const fj = sh.fijo && !sh.editId ? S.st.fijos.find(f => f.id === sh.fijo) : null;
  if (fj && sh.amount !== fijoAmount(fj, monthOf(sh.date)) && !scope) { sh.ask = true; renderSheet(); return; }
  const id = sh.editId || uid('m_'), wasEdit = !!sh.editId, roll = sh.roll;
  let fijosNow = null;
  if (fj && scope === 'forward') {
    const mm = monthOf(sh.date), ov = { ...(fj.overrides || {}) };
    for (const k of Object.keys(ov)) if (k >= mm) delete ov[k];
    fijosNow = S.st.fijos.map(f => f.id === fj.id ? { ...f, amount: sh.amount, overrides: ov } : f);
  }
  closeSheet();
  if (S.view !== 'ahorro' && monthOf(doc.date) !== S.month) S.month = monthOf(doc.date);
  const msg = wasEdit ? 'Cambios guardados' : { gasto: 'Gasto guardado', ingreso: 'Ingreso guardado', ahorro: 'Ahorro guardado', retiro: 'Listo, lo sacaste' }[doc.type];
  if (putDoc(id, doc, fijosNow ? null : (scope === 'month' ? 'Guardado solo para este mes' : msg))) {
    if (roll) saveSettings({ rolled: { ...S.st.rolled, [roll]: true } });
    if (fijosNow) saveSettings({ fijos: fijosNow }, 'Guardado. Desde ahora se usa el monto nuevo');
  }
}
function keyPress(k) {
  const sh = S.sheet; if (!sh || sh.multi) return;
  let s = sh.amount ? String(sh.amount) : '';
  if (k === 'del') s = s.slice(0, -1); else if (s.length < 11) s = (s + k).replace(/^0+/, '');
  sh.amount = Number(s) || 0; sh.err = ''; sh.ask = false;
  renderSheet();
}

/* ============ render ============ */
function render() {
  const app = document.getElementById('app');
  app.innerHTML = S.view === 'movs' ? viewMovs() : S.view === 'ahorro' ? viewAhorro() : S.view === 'ajustes' ? viewAjustes() : S.view === 'tend' ? viewTend() : viewInicio();
  const tab = (k, l) => `<button data-act="nav" data-v="${k}" ${S.view === k ? 'aria-current="page"' : ''}>${IC[k]}<span>${l}</span></button>`;
  document.getElementById('navin').innerHTML = tab('inicio', 'Inicio') + tab('movs', 'Movimientos') + tab('ahorro', 'Ahorro');
}
let toastT = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2200); }
function setView(v) { S.view = v; S.editBucket = null; S.askFijos = null; if (['inicio', 'movs', 'ahorro'].includes(v)) { try { localStorage.setItem('foco-finanzas-view', v); } catch (e) {} } render(); window.scrollTo(0, 0); }

/* ============ eventos ============ */
document.addEventListener('change', e => {
  if (e.target.id === 'msel') { S.month = e.target.value; render(); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.hasAttribute('data-money')) el.value = fmtIn(parseAmt(el.value));
  if (S.sheet) {
    if (el.id === 'sh-note') S.sheet.note = el.value;
    if (el.id === 'sh-date') { S.sheet.date = el.value; renderSheet(); }
  }
});
document.addEventListener('keydown', e => {
  if (!S.sheet) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.target.tagName === 'INPUT') return;
  if (/^\d$/.test(e.key)) { e.preventDefault(); keyPress(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); keyPress('del'); }
  else if (e.key === 'Enter') { e.preventDefault(); saveSheet(); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'nav': setView(v); break;
    case 'go-month': S.month = v; setView('inicio'); break;
    case 'filter': S.filter = v; render(); break;
    case 'see-gastos': S.filter = 'gasto'; setView('movs'); break;
    case 'see-cat': S.filter = 'cat:' + v; setView('movs'); break;
    case 'add': openSheet(v); break;
    case 'mov': { const m = S.movs.find(x => x.id === v); if (m) openSheet(null, m); break; }
    case 'fijo-pay': { const f = S.st.fijos.find(x => x.id === v); if (f) openSheet('gasto', null, { amount: fijoAmount(f, S.month), cat: f.cat, note: f.name, fijo: f.id, date: S.month === monthOf(todayStr()) ? todayStr() : S.month + '-01' }); break; }
    case 'sh-close': closeSheet(); break;
    case 'sh-type': S.sheet.type = v; S.sheet.err = ''; if (v === 'ingreso' && !S.sheet.note) S.sheet.note = 'Sueldo'; if (v !== 'ingreso' && ['Sueldo', 'Bono', 'Otro'].includes(S.sheet.note)) S.sheet.note = ''; renderSheet(); break;
    case 'sh-cat': S.sheet.cat = v; S.sheet.err = ''; renderSheet(); break;
    case 'sh-bucket': S.sheet.bucket = v; S.sheet.err = ''; renderSheet(); break;
    case 'sh-note': S.sheet.note = v; renderSheet(); break;
    case 'key': keyPress(v); break;
    case 'sh-save': saveSheet(); break;
    case 'sh-scope': saveSheet(v); break;
    case 'sh-noscope': S.sheet.ask = false; renderSheet(); break;
    case 'sh-del':
      if (!S.sheet.confirmDel) { S.sheet.confirmDel = true; renderSheet(); break; }
      { const id = S.sheet.editId; closeSheet(); delDoc(id, 'Movimiento borrado'); } break;
    case 'sh-nodel': S.sheet.confirmDel = false; renderSheet(); break;
    case 'roll': openSheet('ahorro', null, { amount: totals(v).libre, note: 'Sobrante de ' + mName(v), date: todayStr(), roll: v }); break;
    case 'roll-no': saveSettings({ rolled: { ...S.st.rolled, [v]: true } }); break;
    case 'sueldo-reg': putDoc(uid('m_'), { kind: 'mov', type: 'ingreso', amount: S.st.sueldo, date: todayStr(), note: 'Sueldo', createdAt: Date.now() }, 'Sueldo registrado'); break;
    case 'sueldo-set': { const n = parseAmt(document.getElementById('sueldo-in').value); if (!n) { toast('Escribe un monto'); break; } saveSettings({ sueldo: n }, 'Sueldo guardado'); break; }
    case 'fijo-add': {
      const name = document.getElementById('fj-n').value.trim(), amount = parseAmt(document.getElementById('fj-a').value), cat = document.getElementById('fj-c').value;
      if (!name) { toast('Ponle un nombre'); break; }
      if (!amount) { toast('Escribe el monto aproximado'); break; }
      saveSettings({ fijos: [...S.st.fijos, { id: uid('f_'), name, amount, cat }] }, 'Gasto fijo agregado'); break;
    }
    case 'fijos-save': {
      const changes = [];
      for (const f of S.st.fijos) { const el = document.querySelector(`[data-fijo="${CSS.escape(f.id)}"]`); const n = el ? parseAmt(el.value) : 0; if (n && n !== Number(f.amount)) changes.push({ id: f.id, n }); }
      if (!changes.length) { toast('No cambiaste ningún monto'); break; }
      S.askFijos = changes; render();
      setTimeout(() => { const a = document.getElementById('ask-fijos'); if (a) a.scrollIntoView({ block: 'center' }); }, 30); break;
    }
    case 'fijos-scope': {
      const cur = monthOf(todayStr()), nx = addMonths(cur, 1), ch = S.askFijos || [];
      const fijos = S.st.fijos.map(f => {
        const c = ch.find(x => x.id === f.id); if (!c) return f;
        const ov = { ...(f.overrides || {}) };
        if (v === 'month') { ov[cur] = c.n; return { ...f, overrides: ov }; }
        const from = v === 'next' ? nx : cur;
        for (const k of Object.keys(ov)) if (k >= from) delete ov[k];
        if (v === 'next' && !fijoPaid(f, cur)) ov[cur] = Number(f.amount) || 0;
        return { ...f, amount: c.n, overrides: ov };
      });
      S.askFijos = null;
      saveSettings({ fijos }, v === 'month' ? 'Cambiado solo para ' + mName(cur) : 'Montos actualizados'); break;
    }
    case 'fijos-cancel': S.askFijos = null; render(); break;
    case 'fijo-del': saveSettings({ fijos: S.st.fijos.filter(f => f.id !== v) }, 'Gasto fijo quitado'); break;
    case 'limits-save': {
      const cats = S.st.cats.map(c => { const el = document.querySelector(`[data-limit="${CSS.escape(c.id)}"]`); const n = el ? parseAmt(el.value) : (Number(c.limit) || 0); const o = { ...c }; if (n) o.limit = n; else delete o.limit; return o; });
      saveSettings({ cats }, 'Límites guardados'); break;
    }
    case 'cat-add': {
      const name = (document.getElementById('cat-new').value || '').trim(); if (!name) { toast('Escribe un nombre'); break; }
      if (S.st.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) { toast('Esa categoría ya existe'); break; }
      saveSettings({ cats: [...S.st.cats, { id: uid('c_'), name, c: S.st.cats.length % 10 }] }, 'Categoría agregada'); break;
    }
    case 'cat-del': saveSettings({ cats: S.st.cats.filter(c => c.id !== v), fijos: S.st.fijos }, 'Categoría quitada'); break;
    case 'bucket-edit': S.editBucket = v; render(); setTimeout(() => { const f = document.getElementById('bucket-form'); if (f) f.scrollIntoView({ block: 'center' }); }, 30); break;
    case 'bucket-cancel': S.editBucket = null; render(); break;
    case 'bucket-save': {
      const name = (document.getElementById('bn').value || '').trim(), goal = parseAmt(document.getElementById('bg').value), deadline = document.getElementById('bd').value || '';
      if (!name) { toast('Ponle un nombre al bolsillo'); break; }
      const buckets = v === 'new' ? [...S.st.buckets, { id: uid('b_'), name, goal, deadline }] : S.st.buckets.map(b => b.id === v ? { ...b, name, goal, deadline } : b);
      S.editBucket = null; saveSettings({ buckets }, 'Bolsillo guardado'); break;
    }
    case 'bucket-del': S.editBucket = null; saveSettings({ buckets: S.st.buckets.filter(b => b.id !== v) }, 'Bolsillo borrado'); break;
  }
});
window.addEventListener('storage', e => { if (e.key && e.key.endsWith(LKEY)) { load(); render(); } });

load();
render();
</script>
</body>
</html>
